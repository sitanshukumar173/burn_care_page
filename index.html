<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BurnCare — Prototype</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#12345A">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --navy: #12345A;
            --blue: #1769AA;
            --red: #D9363E;
            --bg: #F4F7FB;
            --ink: #1d2a3a;
            --mut: #5d6b7c;
            --line: #dde4ee;
            --ok: #1f8a5b;
            --warn: #b7791f
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg)
        }

        #ban {
            background: var(--red);
            color: #fff;
            text-align: center;
            font-weight: 600;
            padding: 5px 10px;
            font-size: 12.5px
        }

        #app {
            display: flex;
            min-height: calc(100vh - 28px)
        }

        aside {
            width: 224px;
            background: var(--navy);
            color: #cfe0f3;
            padding: 12px 0;
            flex-shrink: 0
        }

        aside a {
            display: block;
            padding: 9px 20px;
            cursor: pointer;
            color: #cfe0f3;
            border-left: 3px solid transparent
        }

        aside a:hover {
            background: #1b4574
        }

        aside a.on {
            background: #1b4574;
            color: #fff;
            border-color: var(--red);
            font-weight: 600
        }

        .main {
            flex: 1;
            min-width: 0
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 20px;
            flex-wrap: wrap
        }

        header img {
            height: 38px
        }

        header .sp {
            flex: 1
        }

        #burger {
            display: none
        }

        .pill {
            background: #eaf2fb;
            color: var(--navy);
            border-radius: 20px;
            padding: 3px 11px;
            font-size: 12px
        }

        section {
            padding: 22px;
            max-width: 1200px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            color: var(--navy)
        }

        h3 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: 15px
        }

        .sub {
            color: var(--mut);
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g5 {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .kpi b {
            display: block;
            font-size: 28px;
            color: var(--blue)
        }

        .kpi span {
            color: var(--mut);
            font-size: 12.5px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        th {
            color: var(--mut);
            font-weight: 600;
            font-size: 12.5px
        }

        tr.cl:hover {
            background: #f0f6fd;
            cursor: pointer
        }

        .tw {
            overflow-x: auto
        }

        button,
        .btn {
            background: var(--blue);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 7px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        button:hover {
            background: var(--navy)
        }

        button.s {
            background: #fff;
            color: var(--blue);
            border: 1px solid var(--blue)
        }

        button.d {
            background: var(--red)
        }

        button.sm {
            padding: 3px 9px;
            font-size: 12.5px
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        aside a:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 1px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #c3cfdf;
            border-radius: 6px;
            font: inherit;
            background: #fff
        }

        label {
            display: block;
            font-weight: 600;
            margin: 10px 0 3px;
            font-size: 12.5px;
            color: var(--navy)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px
        }

        .row>* {
            flex: 1;
            min-width: 140px
        }

        .row>button {
            flex: 0 0 auto
        }

        .st {
            display: inline-block;
            border-radius: 12px;
            padding: 1px 9px;
            font-size: 12px;
            font-weight: 600;
            background: #e6edf6;
            color: var(--navy)
        }

        .st.New {
            background: #e1efff;
            color: var(--blue)
        }

        .st.Referred,
        .st.Overdue {
            background: #fde8e9;
            color: var(--red)
        }

        .st.Closed,
        .st.Completed,
        .st.Approved {
            background: #e2f4ec;
            color: var(--ok)
        }

        .st.Pending,
        .st.Draft,
        .st.Follow-up\ Required,
        .st.Under\ Review {
            background: #fdf1dc;
            color: var(--warn)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0
        }

        .bar i {
            display: block;
            height: 14px;
            background: var(--blue);
            border-radius: 3px;
            min-width: 3px
        }

        .bar span {
            width: 130px;
            font-size: 12.5px;
            color: var(--mut)
        }

        .tag {
            font-size: 11px;
            border: 1px dashed var(--mut);
            color: var(--mut);
            border-radius: 4px;
            padding: 0 5px;
            margin-left: 6px
        }

        #chat {
            height: 420px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px
        }

        .msg {
            max-width: 82%;
            padding: 9px 13px;
            border-radius: 12px;
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word
        }

        .msg.u {
            background: var(--blue);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 2px
        }

        .msg.b {
            background: #eef3f9;
            border-bottom-left-radius: 2px
        }

        .msg.em {
            background: #fde8e9;
            border: 2px solid var(--red);
            color: #7a141a;
            font-weight: 600
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 14px;
            background: #eef3f9;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            margin: 8px 0;
            width: fit-content
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            display: inline-block;
            animation: bounceDot 1.4s infinite ease-in-out both
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s }
        .typing-dot:nth-child(2) { animation-delay: -0.16s }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4 }
            40% { transform: scale(1); opacity: 1 }
        }

        .typing-text {
            font-size: 12px;
            color: var(--mut);
            margin-left: 6px;
            font-style: italic
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: var(--navy);
            margin-left: 2px;
            vertical-align: middle;
            animation: blinkCur 0.8s infinite
        }

        @keyframes blinkCur { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

        .chat-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

        .action-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0
        }

        .action-tray .chip {
            margin: 0;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04)
        }

        .action-tray .chip:hover {
            background: var(--blue);
            color: #fff
        }

        .src {
            display: block;
            font-size: 11.5px;
            color: var(--mut);
            margin-top: 5px;
            font-weight: 400
        }

        .chip {
            display: inline-block;
            border: 1px solid var(--blue);
            color: var(--blue);
            border-radius: 16px;
            padding: 3px 11px;
            margin: 3px 4px 3px 0;
            cursor: pointer;
            font-size: 12.5px;
            background: #fff
        }

        .warn {
            background: #fff4f4;
            border-left: 4px solid var(--red);
            padding: 9px 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px
        }

        #mod {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 45, .55);
            display: none;
            align-items: flex-start;
            justify-content: center;
            overflow: auto;
            z-index: 20;
            padding: 30px 10px
        }

        #mod .box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            width: min(600px, 100%)
        }

        #mod .err {
            color: var(--red);
            font-size: 12.5px
        }

        #toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: var(--navy);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            display: none;
            z-index: 30
        }

        #toast.e {
            background: var(--red)
        }

        .bm [data-n] {
            fill: url(#sk);
            stroke: #6f86a3;
            stroke-width: 1.2;
            cursor: pointer
        }

        .bm [data-n]:hover {
            stroke: var(--blue);
            stroke-width: 2.2
        }

        .bm .sel {
            fill: url(#sr);
            stroke: var(--red)
        }

        .tl {
            border-left: 3px solid var(--line);
            margin-left: 6px;
            padding-left: 14px
        }

        .tl div {
            margin-bottom: 10px;
            position: relative
        }

        .tl div:before {
            content: "";
            position: absolute;
            left: -21px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--blue)
        }

        #pr {
            display: none
        }

        @media(max-width:800px) {
            aside {
                position: fixed;
                left: -240px;
                top: 28px;
                bottom: 0;
                z-index: 10;
                transition: left .2s
            }

            aside.open {
                left: 0
            }

            #burger {
                display: block
            }
        }

        @media print {
            body * {
                visibility: hidden
            }

            #pr,
            #pr * {
                visibility: visible
            }

            #pr {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #fff
            }

            #ban {
                display: none
            }
        }
    </style>
</head>

<body>
    <div id="ban">PROTOTYPE — DEMO DATA ONLY — NOT FOR REAL PATIENT CARE</div>
    <div id="app">
        <aside id="nav"></aside>
        <div class="main">
            <header><button id="burger" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><b
                    style="font-size:21px;color:var(--navy);letter-spacing:.3px">BurnCare</b><span class="pill"
                    id="hn"></span><span class="sp"></span><button class="sm s" onclick="toggleLanguage()" id="langBtn" style="font-weight:600;padding:4px 10px;cursor:pointer">🌐 English</button><span class="pill" title="Demo notifications">🔔 <span
                        id="nn"></span> demo alerts</span><span class="pill" id="un"></span><button id="ib" class="sm"
                    style="display:none" onclick="ip.prompt()">Install app</button></header>
            <section id="v"></section>
        </div>
    </div>
    <div id="mod">
        <div class="box" id="mb"></div>
    </div>
    <div id="toast"></div>
    <div id="pr"></div>
    <script>
        /* ===== 4. DATA MODEL & 9. PERSISTENCE ===== */
        const K = 'mbc_v1', $ = s => document.querySelector(s), d = n => { let x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) }, T = d(0);
        const ST = ['New', 'Under Review', 'Follow-up Required', 'Referred', 'Closed'], REG = { front: ['Head', 'Neck', 'Chest', 'Abdomen', 'Right Arm', 'Left Arm', 'Right Hand', 'Left Hand', 'Right Thigh', 'Left Thigh', 'Right Leg', 'Left Leg', 'Right Foot', 'Left Foot', 'Genitalia'], back: ['Head (back)', 'Neck (back)', 'Upper Back', 'Lower Back', 'Right Arm (back)', 'Left Arm (back)', 'Right Hand (back)', 'Left Hand (back)', 'Right Thigh (back)', 'Left Thigh (back)', 'Right Calf', 'Left Calf', 'Right Foot (back)', 'Left Foot (back)', 'Buttocks'] };
        function seed() {
            return {
                set: { hosp: 'Demo Hospital — Sample Data', user: 'Dr. Demo Clinician (fictional)', lang: 'en' },
                pts: [{ id: 'P-1001', name: 'Asha Verma (fictional)', age: 34, sex: 'F', clin: 'Dr. A. Sharma' }, { id: 'P-1002', name: 'Rohan Mehta (fictional)', age: 8, sex: 'M', clin: 'Dr. K. Iyer' }, { id: 'P-1003', name: 'Sunita Rao (fictional)', age: 52, sex: 'F', clin: 'Dr. A. Sharma' }],
                cases: [{ id: 'C-2001', pid: 'P-1001', cr: d(-20), inj: d(-21) + 'T18:30', mech: 'Hot liquid scald', reg: ['Left Hand', 'Left Arm'], assess: 'Entered by clinician: partial area involvement, dressing applied.', clin: 'Dr. A. Sharma', fu: d(2), status: 'Follow-up Required', notes: [{ t: d(-20), by: 'Dr. A. Sharma', x: 'Initial review. Plan: dressing and review as set by clinician.' }] },
                { id: 'C-2002', pid: 'P-1002', cr: d(-6), inj: d(-6) + 'T09:10', mech: 'Flame', reg: ['Right Thigh'], assess: '', clin: 'Dr. K. Iyer', fu: d(-1), status: 'Referred', notes: [] },
                { id: 'C-2003', pid: 'P-1003', cr: d(-45), inj: d(-46) + 'T20:00', mech: 'Chemical', reg: ['Chest'], assess: 'Entered by clinician: reviewed, healing documented.', clin: 'Dr. A. Sharma', fu: '', status: 'Closed', notes: [{ t: d(-30), by: 'Dr. A. Sharma', x: 'Healing documented. Discharged from active follow-up.' }] }],
                fus: [{ id: 'F-1', cid: 'C-2001', clin: 'Dr. A. Sharma', due: d(2), status: 'Pending', notes: 'Wound review' }, { id: 'F-2', cid: 'C-2002', clin: 'Dr. K. Iyer', due: d(-1), status: 'Pending', notes: 'Post-referral check' }, { id: 'F-3', cid: 'C-2003', clin: 'Dr. A. Sharma', due: d(-30), status: 'Completed', notes: 'Final review' }],
                refs: [{ id: 'R-1', cid: 'C-2002', from: 'Demo Hospital — Sample Data', to: 'Demo Burn Centre (fictional)', reason: 'Specialist burn-unit review requested by clinician.', notes: 'Fictional demo referral.', date: d(-5), status: 'Pending' }],
                kb: [{ id: 'K-1', title: 'Immediate first aid (sample)', cat: 'First aid', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-2', title: 'When to seek urgent care (sample)', cat: 'Emergency escalation', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-3', title: 'Follow-up purpose (sample)', cat: 'Follow-up education', src: 'Demo Hospital (fictional)', rev: d(-3), st: 'Draft' }]
            }
        }
        let D; try { D = JSON.parse(localStorage.getItem(K)) || seed() } catch (e) { D = seed() }
        const save = () => { try { localStorage.setItem(K, JSON.stringify(D)) } catch (e) { } };
        const nid = (p, a) => p + ((Math.max(0, ...a.map(x => parseInt(x.id.split('-')[1]) || 0))) + 1);
        const pn = id => (D.pts.find(p => p.id == id) || {}).name || id, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const st = s => `<span class="st ${s}">${s}</span>`;
        function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = e ? 'e' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600) }
        /* ===== 5. FORMS & VALIDATION ===== */
        function modal(title, fields, vals, cb) {
            vals = vals || {};
            $('#mb').innerHTML = `<h3>${title}</h3><form id="f" onsubmit="return false">` + fields.map(f => {
                const v = vals[f.k] ?? f.v ?? ''; let i;
                if (f.t == 'select') i = `<select name="${f.k}">${f.o.map(o => { o = [].concat(o); return `<option value="${esc(o[0])}" ${o[0] == v ? 'selected' : ''}>${esc(o[1] ?? o[0])}</option>` }).join('')}</select>`;
                else if (f.t == 'textarea') i = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
                else i = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}">`;
                return `<label>${f.l}${f.req ? ' *' : ''}</label>${i}`
            }).join('') + `<p class="err" id="er"></p><div class="row"><button id="sv">Save</button><button class="s" onclick="closeM()">Cancel</button></div></form>`;
            $('#mod').style.display = 'flex';
            $('#sv').onclick = () => { const o = {}; new FormData($('#f')).forEach((v, k) => o[k] = v.trim()); const m = fields.filter(f => f.req && !o[f.k]); if (m.length) { $('#er').textContent = 'Please complete: ' + m.map(f => f.l).join(', '); return } cb(o); closeM() }
        }
        const closeM = () => $('#mod').style.display = 'none';
        const caseOpts = () => D.cases.map(c => [c.id, c.id + ' — ' + pn(c.pid)]), ptOpts = () => D.pts.map(p => [p.id, p.name]);
        /* ===== 3. NAVIGATION ===== */
        const NAV = [['ov', 'Overview'], ['ai', 'BurnCare AI'], ['pt', 'Patients'], ['cs', 'Burn Cases'], ['bm', 'Digital Body Map'], ['fu', 'Follow-ups'], ['rf', 'Referrals'], ['an', 'Hospital Analytics'], ['kc', 'Knowledge Centre'], ['se', 'Settings']];
        let cur = 'ov', sel = { pid: null, cid: null }, flt = { q: '', s: '' };
        function go(v, x) { cur = v; tb = null; bmSel = null; if (x) Object.assign(sel, x); flt = { q: '', s: '' }; nav.classList.remove('open'); draw() }
        function draw() {
            $('#nav').innerHTML = NAV.map(n => `<a tabindex="0" class="${n[0] == cur ? 'on' : ''}" onclick="go('${n[0]}')" onkeydown="if(event.key=='Enter')go('${n[0]}')">${n[1]}</a>`).join('');
            $('#hn').textContent = D.set.hosp; $('#un').textContent = D.set.user; $('#nn').textContent = D.fus.filter(f => f.status == 'Pending' && f.due < T).length;
            const langLabels = { en: '🌐 English', hi: '🌐 हिन्दी', hinglish: '🌐 Hinglish' };
            if ($('#langBtn')) $('#langBtn').textContent = langLabels[D.set.lang] || '🌐 ' + D.set.lang;
            $('#v').innerHTML = V[cur](); if (cur == 'ai') chatInit(); if (cur == 'bm') { bmInit(); tbInit() }
        }
        const head = (t, s, b) => `<div class="row"><div><h1>${t}</h1><div class="sub">${s || ''}</div></div>${b || ''}</div>`;
        const bars = o => { const m = Math.max(1, ...Object.values(o)); return Object.entries(o).map(([k, v]) => `<div class="bar"><span>${k}</span><i style="width:${v / m * 60}%"></i><b>${v}</b></div>`).join('') };
        const cnt = (a, f) => a.reduce((o, x) => (o[f(x)] = (o[f(x)] || 0) + 1, o), {});
        const doc = () => D.cases.length ? Math.round(D.cases.filter(c => c.assess && c.notes.length).length / D.cases.length * 100) : 0;
        /* ===== VIEWS ===== */
        const V = {
            ov() {
                const due = D.fus.filter(f => f.status == 'Pending' && f.due <= d(7)).length, rp = D.refs.filter(r => r.status == 'Pending').length, nm = D.cases.filter(c => c.cr.slice(0, 7) == T.slice(0, 7)).length;
                return head('Overview', 'Demo Hospital — Sample Data. All figures are sample/demo data.', `<button onclick="caseForm()">New case</button><button class="s" onclick="go('ai')">Open BurnCare AI</button><button class="s" onclick="go('rf')">Generate referral</button>`) +
                    `<div class="grid g5">${[['Total demo cases', D.cases.length], ['New this month', nm], ['Follow-ups due (7 days)', due], ['Referrals pending', rp], ['Documentation complete', doc() + '%']].map(k => `<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div><br>
<div class="grid g2"><div class="card"><h3>Recent case activity</h3>${D.cases.slice(-4).reverse().map(c => `<p><a href="#" onclick="go('cs',{cid:'${c.id}'});return false">${c.id}</a> ${esc(pn(c.pid))} ${st(c.status)}</p>`).join('') || 'No cases yet.'}</div>
<div class="card"><h3>Upcoming follow-ups</h3>${D.fus.filter(f => f.status == 'Pending').sort((a, b) => a.due > b.due ? 1 : -1).slice(0, 4).map(f => `<p>${f.due} — ${f.cid} ${f.due < T ? st('Overdue') : ''}</p>`).join('') || 'None.'}</div>
<div class="card"><h3>Cases by status (sample)</h3>${bars(cnt(D.cases, c => c.status))}</div><div class="card"><h3>Referral status (sample)</h3>${bars(cnt(D.refs, r => r.status))}</div></div>`
            },
            ai() {
                const L = D.set.lang == 'hi'; 
                return head('BurnCare AI', (L ? 'लाइव AI — CSJMU BurnCare Saathi' : 'Live AI — CSJMU BurnCare Saathi'), 
                    `<button class="s" onclick="D.set.lang=D.set.lang=='hi'?'en':'hi';save();stringsP=null;hist=[];draw()">${L ? 'English' : 'हिन्दी'}</button>` +
                    `<button class="s" onclick="apiConfigModal()">⚙️ API</button>` +
                    `<button class="s" onclick="chat=[];hist=[];chatInit()">${L ? 'बातचीत साफ़ करें' : 'Clear chat'}</button>`) +

        function mergeFindings(regs) {

                if (i < 0) { caseBurns.push({ region: r.region, fraction: frac, depth: r.depth }); return; }

                if (DEPTH_O.indexOf(r.depth) > DEPTH_O.indexOf(b.depth)) b.depth = r.depth;

            ],
            patna: [
                { name: 'AIIMS Patna (Specialized Burn & Plastic Surgery Unit)', kind: 'hospital', distance_km: 5.2, burn_unit: true, major: true, phone: '0612-2451070', directions_url: 'https://maps.google.com/?q=AIIMS+Patna' },
                { name: 'PMCH Patna Medical College & Hospital', kind: 'hospital', distance_km: 6.0, burn_unit: true, major: true, phone: '0612-2300080', directions_url: 'https://maps.google.com/?q=PMCH+Patna' },
                { name: 'IGIMS Indira Gandhi Institute of Medical Sciences', kind: 'hospital', distance_km: 7.4, burn_unit: true, major: true, phone: '0612-2297099', directions_url: 'https://maps.google.com/?q=IGIMS+Patna' }
            ],
            delhi: [
                { name: 'Safdarjung Hospital (National Apex Burn Care Centre)', kind: 'hospital', distance_km: 3.5, burn_unit: true, major: true, phone: '011-26165060', directions_url: 'https://maps.google.com/?q=Safdarjung+Hospital+Burns+Delhi' },
                { name: 'AIIMS New Delhi (Emergency & Burn Trauma)', kind: 'hospital', distance_km: 3.8, burn_unit: true, major: true, phone: '011-26588500', directions_url: 'https://maps.google.com/?q=AIIMS+New+Delhi' },
                { name: 'Dr. Ram Manohar Lohia (RML) Hospital', kind: 'hospital', distance_km: 5.1, burn_unit: true, major: true, phone: '011-23365525', directions_url: 'https://maps.google.com/?q=RML+Hospital+Delhi' }
            ]
        };

        function aiHospitalGo() {
            const L = D.set.lang === 'hi';
            if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
                showTyping(L ? 'डिवाइस लोकेशन प्राप्त की जा रही है…' : 'Requesting device GPS location…');
                navigator.geolocation.getCurrentPosition(
                    p => { 
                        removeTyping();
                        chat.push({ c: 'u', x: L ? '📍 मेरी लोकेशन भेजी' : '📍 Shared current location' });
                        chatInit();
                        hospLookup({ lat: p.coords.latitude, lon: p.coords.longitude }); 
                    }, 
                    err => { 
                        removeTyping();
                        hospCityFallback(); 
                    }, 
                    { timeout: 7000, maximumAge: 60000 }
                );
            } else {
                hospCityFallback();
            }
        }

        function hospCityFallback() {
            const L = D.set.lang === 'hi';
            pushBot(
                '<b>📍 ' + (L ? 'नज़दीकी अस्पताल व बर्न सेंटर खोजें' : 'Find Nearby Hospitals & Burn Centers') + '</b><br>' +
                (L ? 'शहर, ज़िले का नाम चुनें या लिखें:' : 'Select or type a city, district or area:') + 
                '<div class="chat-bar" style="margin-top:8px">' +
                    '<input id="hcity" placeholder="e.g. Kanpur, Lucknow, Patna, Delhi" onkeydown="if(event.key==&quot;Enter&quot;)hospLookup({ place: this.value })" style="flex:1">' +
                    '<button class="sm" onclick="hospLookup({ place: document.getElementById(&quot;hcity&quot;).value })">' + (L ? 'खोजें' : 'Search') + '</button>' +
                '</div>' +
                '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">' +
                    ['Kanpur', 'Lucknow', 'Patna', 'Delhi'].map(c => `<button class="s sm" onclick="hospLookup({ place: '${c}' })">📍 ${c}</button>`).join('') +
                '</div>',
                { html: 1 }
            );
        }

        async function hospLookup(q) {
            const L = D.set.lang === 'hi'; 
            showTyping(L ? 'अस्पताल व बर्न यूनिट खोजी जा रही हैं…' : 'Locating nearest hospitals & burn centers…');
            
            // 1. Try server endpoint
            try {
                const r = await fetch((API ? API : '') + '/api/hospitals', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(q) 
                });
                if (r.ok) {
                    const d = await r.json();
                    if (d.ok && d.places && d.places.length) {
                        removeTyping();
                        renderHospitals(d.places, d.where || 'your area', d.title, d.emergency_line);
                        return;
                    }
                }
            } catch (err) { }

            // 2. Client-side Nominatim & local directory fallback
            removeTyping();
            const placeKey = (q.place || '').toLowerCase();
            let matches = null;
            for (let k in CITY_HOSPITALS) {
                if (placeKey.includes(k) || k.includes(placeKey)) {
                    matches = CITY_HOSPITALS[k];
                    break;
                }
            }
            if (!matches) {
                matches = CITY_HOSPITALS.kanpur; // Default to Kanpur (CSJMU home)
            }
            renderHospitals(matches, q.place || (q.lat ? 'GPS Location' : 'Kanpur / UP'));
        }

        function renderHospitals(places, locationName, title, emergencyLine) {
            const L = D.set.lang === 'hi';
            let h = '<b>' + (title || ('🏥 ' + (L ? 'नज़दीकी अस्पताल व बर्न यूनिट: ' : 'Hospitals near ') + locationName)) + '</b><br>' +
                    '<b style="color:var(--red)">' + (emergencyLine || '🚨 Emergency: 112 / 108') + '</b><br><br>';
            
            places.forEach(p => {
                const tags = (p.burn_unit ? ' <span class="tag" style="background:#fde8e9;color:var(--red);border-color:var(--red);font-weight:600">🔥 Burn Unit</span>' : '') + 
                             (p.major ? ' <span class="tag" style="background:#eaf2fb;color:var(--navy)">🏛 Government / Teaching</span>' : '');
                h += '<b>' + esc(p.name) + '</b>' + tags + '<br>' + 
                     (p.kind === 'hospital' ? 'Hospital' : 'Medical Center') + 
                     ' · <b>' + p.distance_km + ' km</b>' + 
                     (p.phone ? ' · 📞 <a href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a>' : '') + 
                     ' · <a href="' + esc(p.directions_url) + '" target="_blank" rel="noopener">🗺️ ' + (L ? 'दिशा-निर्देश (Directions)' : 'Get Directions') + '</a><br><br>';
            });
            h += `<small style="color:var(--mut)">${L ? 'ओपनस्ट्रीटमैप व अधिकृत स्वास्थ्य निर्देशिका से सत्यापित।' : 'Verified with OpenStreetMap & state burn care network.'}</small>`;
            pushBot(h, { html: 1 });
        }

        async function ask(q) {
            const i = $('#ci'); 
            q = (q || (i && i.value) || '').trim(); 
            if (!q) return; 
            if (i) i.value = ''; 
            const L = D.set.lang === 'hi';
            
            chat.push({ c: 'u', x: q });
            if (EMG.test(q)) {
                chat.push({ c: 'em', x: L ? '⚠ यह गंभीर हो सकता है। देरी न करें — तुरंत 112 / 108 डायल करें या नज़दीकी आपातकालीन केंद्र जाएँ।' : '⚠ Critical burn warning: Do not delay — call 112 / 108 or proceed to the nearest emergency burn unit immediately.' });
            }
            chatInit(); 
            showTyping(L ? 'जवाब तैयार हो रहा है…' : 'BurnCare AI is thinking…');
            
            try {
                const r = await fetch((API ? API : '') + '/api/chat', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ message: q, history: hist.slice(-12), lang: API_LANG() }) 
                });
                if (!r.ok) throw new Error('API error');
                const d = await r.json();
                hist.push(['user', q], ['model', d.answer]); 
                if (hist.length > 12) hist = hist.slice(-12);
                
                await streamBotMessage(d.answer);
            } catch (e) { 
                removeTyping();
                // Intelligent medical response engine for offline/presentation resiliency
                const qLower = q.toLowerCase();
                let ans = '';
                if (qLower.includes('cool') || qLower.includes('water') || qLower.includes('ठंडा') || qLower.includes('पानी')) {
                    ans = L 
                        ? 'जले हुए हिस्से को तुरंत नल के ठंडे बहते पानी में 20 मिनट तक रखें। बर्फ़ का इस्तेमाल कभी न करें, क्योंकि इससे त्वचा की कोशिकाएँ नष्ट हो सकती हैं।'
                        : 'Cool the burn immediately under cool, running tap water for 20 minutes. Never apply ice or ice water, as extreme cold damages healing tissue.';
                } else if (qLower.includes('blister') || qLower.includes('छाले') || qLower.includes('फोड़')) {
                    ans = L 
                        ? 'छालों को कभी न फोड़ें। छाले की त्वचा अंदर के घाव को संक्रमण से बचाने के लिए प्राकृतिक सुरक्षा कवच का काम करती है। यदि छाला फूट जाए तो साफ़ क्लिंग फ़िल्म से ढीला ढकें।'
                        : 'Never burst blisters. Blisters form a sterile protective barrier over damaged skin. If a blister breaks on its own, clean gently with mild soap and water, and cover loosely.';
                } else if (qLower.includes('colgate') || qLower.includes('toothpaste') || qLower.includes('haldi') || qLower.includes('oil') || qLower.includes('टूथपेस्ट')) {
                    ans = L 
                        ? 'जले स्थान पर टूथपेस्ट, तेल, घी, मक्खन, अंडा या हल्दी बिल्कुल न लगाएँ। ये चीजें त्वचा की गर्मी को अंदर रोक लेती हैं और गंभीर संक्रमण का कारण बनती हैं।'
                        : 'Do NOT apply toothpaste, butter, oil, egg, or turmeric to a burn. These trap heat inside the tissues and increase the risk of severe bacterial infection.';
                } else if (qLower.includes('chemical') || qLower.includes('acid') || qLower.includes('तेज़ाब')) {
                    ans = L 
                        ? 'केमिकल या तेज़ाब से जलने पर: सूखा केमिकल पाउडर झाड़ दें, केमिकल लगे कपड़े उतारें और कम से कम 20 मिनट तक लगातार साफ़ बहते पानी से धोएँ। तुरंत अस्पताल जाएँ।'
                        : 'Chemical burn protocol: brush off dry chemical powder, remove contaminated clothing, and irrigate with running water for at least 20 continuous minutes. Seek hospital care.';
                } else {
                    ans = L 
                        ? 'जलने पर प्राथमिक उपचार: 1. जले हिस्से को तुरंत 20 मिनट तक ठंडे बहते पानी में रखें। 2. अंगूठी व कपड़े तुरंत उतारें। 3. क्लिंग फ़िल्म से ढीला ढकें। 4. बर्फ़, टूथपेस्ट या घी न लगाएँ।'
                        : 'Immediate burn guidance: 1. Cool under clean running water for 20 minutes. 2. Remove rings, watches and loose clothing. 3. Cover loosely with sterile plastic cling film. 4. Never apply ice, butter, or toothpaste. In emergency, call 112/108.';
                }
                hist.push(['user', q], ['model', ans]);
                await streamBotMessage(ans);
            }
        }
        /* ===== 10. INIT ===== */
        draw();
        let ip; addEventListener('beforeinstallprompt', e => { e.preventDefault(); ip = e; $('#ib').style.display = '' });
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
    </script>
</body>

</html>
