<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BurnCare — Prototype</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#12345A">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --navy: #12345A;
            --blue: #1769AA;
            --red: #D9363E;
            --bg: #F4F7FB;
            --ink: #1d2a3a;
            --mut: #5d6b7c;
            --line: #dde4ee;
            --ok: #1f8a5b;
            --warn: #b7791f
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg)
        }

        #ban {
            background: var(--red);
            color: #fff;
            text-align: center;
            font-weight: 600;
            padding: 5px 10px;
            font-size: 12.5px
        }

        #app {
            display: flex;
            min-height: calc(100vh - 28px)
        }

        aside {
            width: 224px;
            background: var(--navy);
            color: #cfe0f3;
            padding: 12px 0;
            flex-shrink: 0
        }

        aside a {
            display: block;
            padding: 9px 20px;
            cursor: pointer;
            color: #cfe0f3;
            border-left: 3px solid transparent
        }

        aside a:hover {
            background: #1b4574
        }

        aside a.on {
            background: #1b4574;
            color: #fff;
            border-color: var(--red);
            font-weight: 600
        }

        .main {
            flex: 1;
            min-width: 0
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 20px;
            flex-wrap: wrap
        }

        header img {
            height: 38px
        }

        header .sp {
            flex: 1
        }

        #burger {
            display: none
        }

        .pill {
            background: #eaf2fb;
            color: var(--navy);
            border-radius: 20px;
            padding: 3px 11px;
            font-size: 12px
        }

        section {
            padding: 18px clamp(14px, 2.5vw, 28px);
            max-width: 1200px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            color: var(--navy)
        }

        h3 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: 15px
        }

        .sub {
            color: var(--mut);
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g5 {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .kpi b {
            display: block;
            font-size: 28px;
            color: var(--blue)
        }

        .kpi span {
            color: var(--mut);
            font-size: 12.5px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        th {
            color: var(--mut);
            font-weight: 600;
            font-size: 12.5px
        }

        tr.cl:hover {
            background: #f0f6fd;
            cursor: pointer
        }

        .tw {
            overflow-x: auto
        }

        button,
        .btn {
            background: var(--blue);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 7px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        button:hover {
            background: var(--navy)
        }

        button.s {
            background: #fff;
            color: var(--blue);
            border: 1px solid var(--blue)
        }

        button.d {
            background: var(--red)
        }

        button.sm {
            padding: 3px 9px;
            font-size: 12.5px
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        aside a:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 1px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #c3cfdf;
            border-radius: 6px;
            font: inherit;
            background: #fff
        }

        label {
            display: block;
            font-weight: 600;
            margin: 10px 0 3px;
            font-size: 12.5px;
            color: var(--navy)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px
        }

        .row>* {
            flex: 1;
            min-width: 140px
        }

        .row>button {
            flex: 0 0 auto
        }

        .st {
            display: inline-block;
            border-radius: 12px;
            padding: 1px 9px;
            font-size: 12px;
            font-weight: 600;
            background: #e6edf6;
            color: var(--navy)
        }

        .st.New {
            background: #e1efff;
            color: var(--blue)
        }

        .st.Referred,
        .st.Overdue {
            background: #fde8e9;
            color: var(--red)
        }

        .st.Closed,
        .st.Completed,
        .st.Approved {
            background: #e2f4ec;
            color: var(--ok)
        }

        .st.Pending,
        .st.Draft,
        .st.Follow-up\ Required,
        .st.Under\ Review {
            background: #fdf1dc;
            color: var(--warn)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0
        }

        .bar i {
            display: block;
            height: 14px;
            background: var(--blue);
            border-radius: 3px;
            min-width: 3px
        }

        .bar span {
            width: 130px;
            font-size: 12.5px;
            color: var(--mut)
        }

        .tag {
            font-size: 11px;
            border: 1px dashed var(--mut);
            color: var(--mut);
            border-radius: 4px;
            padding: 0 5px;
            margin-left: 6px
        }

        #chat {
            height: min(58vh, 560px);
            min-height: 300px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: clamp(10px, 2vw, 18px);
            scroll-behavior: smooth
        }

        .msg {
            max-width: min(88%, 760px);
            padding: 10px 13px;
            border-radius: 12px;
            margin: 8px 0;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.55
        }

        .msg:not(.rich) {
            white-space: pre-wrap
        }

        .msg.u {
            background: var(--blue);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 2px
        }

        .msg.u-photo {
            background: transparent !important;
            padding: 0 !important;
            margin-left: auto;
            box-shadow: none;
            max-width: 280px
        }

        .msg.u-photo img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 12px;
            border: 2px solid var(--line);
            display: block;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12)
        }

        .msg.b {
            background: #eef3f9;
            border-bottom-left-radius: 2px;
            max-width: min(94%, 860px)
        }

        .msg.b img,
        .msg.b table,
        .msg.b .action-tray {
            max-width: 100%
        }

        .msg.b a {
            overflow-wrap: anywhere
        }

        .bot-mark {
            width: 36px;
            height: 36px;
            margin: 0 auto 8px;
            display: grid;
            place-items: center;
            border: 1px solid #b9cde2;
            border-radius: 9px;
            background: #f3f7fb;
            color: var(--blue);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px
        }

        .msg.em {
            background: #fde8e9;
            border: 2px solid var(--red);
            color: #7a141a;
            font-weight: 600
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 14px;
            background: #eef3f9;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            margin: 8px 0;
            width: fit-content
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            display: inline-block;
            animation: bounceDot 1.4s infinite ease-in-out both
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s }
        .typing-dot:nth-child(2) { animation-delay: -0.16s }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4 }
            40% { transform: scale(1); opacity: 1 }
        }

        .typing-text {
            font-size: 12px;
            color: var(--mut);
            margin-left: 6px;
            font-style: italic
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: var(--navy);
            margin-left: 2px;
            vertical-align: middle;
            animation: blinkCur 0.8s infinite
        }

        @keyframes blinkCur { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

        .chat-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
            position: sticky;
            bottom: 0;
            background: var(--bg);
            padding-top: 2px
        }

        .action-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0
        }

        .action-tray .chip {
            margin: 0;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04)
        }

        .action-tray .chip:hover {
            background: var(--blue);
            color: #fff
        }

        .src {
            display: block;
            font-size: 11.5px;
            color: var(--mut);
            margin-top: 5px;
            font-weight: 400
        }

        .chip {
            display: inline-block;
            border: 1px solid var(--blue);
            color: var(--blue);
            border-radius: 16px;
            padding: 3px 11px;
            margin: 3px 4px 3px 0;
            cursor: pointer;
            font-size: 12.5px;
            background: #fff
        }

        .warn {
            background: #fff4f4;
            border-left: 4px solid var(--red);
            padding: 9px 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px
        }

        #mod {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 45, .55);
            display: none;
            align-items: flex-start;
            justify-content: center;
            overflow: auto;
            z-index: 20;
            padding: 30px 10px
        }

        #mod .box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            width: min(600px, 100%)
        }

        #mod .err {
            color: var(--red);
            font-size: 12.5px
        }

        #toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: var(--navy);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            display: none;
            z-index: 30
        }

        #toast.e {
            background: var(--red)
        }

        .bm [data-n] {
            fill: url(#sk);
            stroke: #6f86a3;
            stroke-width: 1.2;
            cursor: pointer
        }

        .bm [data-n]:hover {
            stroke: var(--blue);
            stroke-width: 2.2
        }

        .bm .sel {
            fill: url(#sr);
            stroke: var(--red)
        }

        .tl {
            border-left: 3px solid var(--line);
            margin-left: 6px;
            padding-left: 14px
        }

        .tl div {
            margin-bottom: 10px;
            position: relative
        }

        .tl div:before {
            content: "";
            position: absolute;
            left: -21px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--blue)
        }

        #pr {
            display: none
        }

        @media(max-width:800px) {
            aside {
                position: fixed;
                left: -240px;
                top: 28px;
                bottom: 0;
                z-index: 10;
                transition: left .2s
            }

            aside.open {
                left: 0
            }

            #burger {
                display: block
            }

            section {
                padding: 14px 10px
            }

            header {
                padding: 8px 12px;
                gap: 8px
            }

            header .pill {
                max-width: 42vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            #chat {
                height: 52vh;
                min-height: 280px
            }

            .msg,
            .msg.b {
                max-width: 96%
            }

            .chat-bar {
                align-items: stretch
            }

            .chat-bar input {
                min-width: 0
            }
        }

        @media print {
            body * {
                visibility: hidden
            }

            #pr,
            #pr * {
                visibility: visible
            }

            #pr {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #fff
            }

            #ban {
                display: none
            }
        }
    </style>
</head>

<body>
    <div id="ban">PROTOTYPE — DEMO DATA ONLY — NOT FOR REAL PATIENT CARE</div>
    <div id="app">
        <aside id="nav"></aside>
        <div class="main">
            <header><button id="burger" onclick="nav.classList.toggle('open')" aria-label="Menu">Menu</button><b
                    style="font-size:21px;color:var(--navy);letter-spacing:.3px">BurnCare</b><span class="pill"
                    id="hn"></span><span class="sp"></span><button class="sm s" onclick="toggleLanguage()" id="langBtn" style="font-weight:600;padding:4px 10px;cursor:pointer">English</button><span class="pill" title="Demo notifications"><span
                        id="nn"></span> demo alerts</span><span class="pill" id="un"></span><button id="ib" class="sm"
                    style="display:none" onclick="ip.prompt()">Install app</button></header>
            <section id="v"></section>
        </div>
    </div>
    <div id="mod">
        <div class="box" id="mb"></div>
    </div>
    <div id="toast"></div>
    <div id="pr"></div>
    <script>
        /* ===== 4. DATA MODEL & 9. PERSISTENCE ===== */
        const K = 'mbc_v1', $ = s => document.querySelector(s), d = n => { let x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) }, T = d(0);
        const ST = ['New', 'Under Review', 'Follow-up Required', 'Referred', 'Closed'], REG = { front: ['Head', 'Neck', 'Chest', 'Abdomen', 'Right Arm', 'Left Arm', 'Right Hand', 'Left Hand', 'Right Thigh', 'Left Thigh', 'Right Leg', 'Left Leg', 'Right Foot', 'Left Foot', 'Genitalia'], back: ['Head (back)', 'Neck (back)', 'Upper Back', 'Lower Back', 'Right Arm (back)', 'Left Arm (back)', 'Right Hand (back)', 'Left Hand (back)', 'Right Thigh (back)', 'Left Thigh (back)', 'Right Calf', 'Left Calf', 'Right Foot (back)', 'Left Foot (back)', 'Buttocks'] };
        function seed() {
            return {
                set: { hosp: 'Demo Hospital — Sample Data', user: 'Dr. Demo Clinician (fictional)', lang: 'en' },
                pts: [{ id: 'P-1001', name: 'Asha Verma (fictional)', age: 34, sex: 'F', clin: 'Dr. A. Sharma' }, { id: 'P-1002', name: 'Rohan Mehta (fictional)', age: 8, sex: 'M', clin: 'Dr. K. Iyer' }, { id: 'P-1003', name: 'Sunita Rao (fictional)', age: 52, sex: 'F', clin: 'Dr. A. Sharma' }],
                cases: [{ id: 'C-2001', pid: 'P-1001', cr: d(-20), inj: d(-21) + 'T18:30', mech: 'Hot liquid scald', reg: ['Left Hand', 'Left Arm'], assess: 'Entered by clinician: partial area involvement, dressing applied.', clin: 'Dr. A. Sharma', fu: d(2), status: 'Follow-up Required', notes: [{ t: d(-20), by: 'Dr. A. Sharma', x: 'Initial review. Plan: dressing and review as set by clinician.' }] },
                { id: 'C-2002', pid: 'P-1002', cr: d(-6), inj: d(-6) + 'T09:10', mech: 'Flame', reg: ['Right Thigh'], assess: '', clin: 'Dr. K. Iyer', fu: d(-1), status: 'Referred', notes: [] },
                { id: 'C-2003', pid: 'P-1003', cr: d(-45), inj: d(-46) + 'T20:00', mech: 'Chemical', reg: ['Chest'], assess: 'Entered by clinician: reviewed, healing documented.', clin: 'Dr. A. Sharma', fu: '', status: 'Closed', notes: [{ t: d(-30), by: 'Dr. A. Sharma', x: 'Healing documented. Discharged from active follow-up.' }] }],
                fus: [{ id: 'F-1', cid: 'C-2001', clin: 'Dr. A. Sharma', due: d(2), status: 'Pending', notes: 'Wound review' }, { id: 'F-2', cid: 'C-2002', clin: 'Dr. K. Iyer', due: d(-1), status: 'Pending', notes: 'Post-referral check' }, { id: 'F-3', cid: 'C-2003', clin: 'Dr. A. Sharma', due: d(-30), status: 'Completed', notes: 'Final review' }],
                refs: [{ id: 'R-1', cid: 'C-2002', from: 'Demo Hospital — Sample Data', to: 'Demo Burn Centre (fictional)', reason: 'Specialist burn-unit review requested by clinician.', notes: 'Fictional demo referral.', date: d(-5), status: 'Pending' }],
                kb: [{ id: 'K-1', title: 'Immediate first aid (sample)', cat: 'First aid', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-2', title: 'When to seek urgent care (sample)', cat: 'Emergency escalation', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-3', title: 'Follow-up purpose (sample)', cat: 'Follow-up education', src: 'Demo Hospital (fictional)', rev: d(-3), st: 'Draft' }]
            }
        }
        let D; try { D = JSON.parse(localStorage.getItem(K)) || seed() } catch (e) { D = seed() }
        const save = () => { try { localStorage.setItem(K, JSON.stringify(D)) } catch (e) { } };
        const nid = (p, a) => p + ((Math.max(0, ...a.map(x => parseInt(x.id.split('-')[1]) || 0))) + 1);
        const pn = id => (D.pts.find(p => p.id == id) || {}).name || id, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const st = s => `<span class="st ${s}">${s}</span>`;
        function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = e ? 'e' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600) }
        /* ===== 5. FORMS & VALIDATION ===== */
        function modal(title, fields, vals, cb) {
            vals = vals || {};
            $('#mb').innerHTML = `<h3>${title}</h3><form id="f" onsubmit="return false">` + fields.map(f => {
                const v = vals[f.k] ?? f.v ?? ''; let i;
                if (f.t == 'select') i = `<select name="${f.k}">${f.o.map(o => { o = [].concat(o); return `<option value="${esc(o[0])}" ${o[0] == v ? 'selected' : ''}>${esc(o[1] ?? o[0])}</option>` }).join('')}</select>`;
                else if (f.t == 'textarea') i = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
                else i = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}">`;
                return `<label>${f.l}${f.req ? ' *' : ''}</label>${i}`
            }).join('') + `<p class="err" id="er"></p><div class="row"><button id="sv">Save</button><button class="s" onclick="closeM()">Cancel</button></div></form>`;
            $('#mod').style.display = 'flex';
            $('#sv').onclick = () => { const o = {}; new FormData($('#f')).forEach((v, k) => o[k] = v.trim()); const m = fields.filter(f => f.req && !o[f.k]); if (m.length) { $('#er').textContent = 'Please complete: ' + m.map(f => f.l).join(', '); return } cb(o); closeM() }
        }
        const closeM = () => $('#mod').style.display = 'none';
        const caseOpts = () => D.cases.map(c => [c.id, c.id + ' — ' + pn(c.pid)]), ptOpts = () => D.pts.map(p => [p.id, p.name]);
        /* ===== 3. NAVIGATION ===== */
        const NAV = [['ov', 'Overview'], ['ai', 'BurnCare AI'], ['pt', 'Patients'], ['cs', 'Burn Cases'], ['bm', 'Digital Body Map'], ['fu', 'Follow-ups'], ['rf', 'Referrals'], ['an', 'Hospital Analytics'], ['kc', 'Knowledge Centre'], ['se', 'Settings']];
        let cur = 'ov', sel = { pid: null, cid: null }, flt = { q: '', s: '' };
        function go(v, x) { cur = v; tb = null; bmSel = null; if (x) Object.assign(sel, x); flt = { q: '', s: '' }; nav.classList.remove('open'); draw() }
        function draw() {
            $('#nav').innerHTML = NAV.map(n => `<a tabindex="0" class="${n[0] == cur ? 'on' : ''}" onclick="go('${n[0]}')" onkeydown="if(event.key=='Enter')go('${n[0]}')">${n[1]}</a>`).join('');
            $('#hn').textContent = D.set.hosp; $('#un').textContent = D.set.user; $('#nn').textContent = D.fus.filter(f => f.status == 'Pending' && f.due < T).length;
            const langLabels = { en: 'English', hi: 'हिन्दी', hinglish: 'Hinglish' };
            if ($('#langBtn')) $('#langBtn').textContent = langLabels[D.set.lang] || D.set.lang;
            $('#v').innerHTML = V[cur](); if (cur == 'ai') chatInit(); if (cur == 'bm') { bmInit(); tbInit() }
        }
        const head = (t, s, b) => `<div class="row"><div><h1>${t}</h1><div class="sub">${s || ''}</div></div>${b || ''}</div>`;
        const bars = o => { const m = Math.max(1, ...Object.values(o)); return Object.entries(o).map(([k, v]) => `<div class="bar"><span>${k}</span><i style="width:${v / m * 60}%"></i><b>${v}</b></div>`).join('') };
        const cnt = (a, f) => a.reduce((o, x) => (o[f(x)] = (o[f(x)] || 0) + 1, o), {});
        const doc = () => D.cases.length ? Math.round(D.cases.filter(c => c.assess && c.notes.length).length / D.cases.length * 100) : 0;
        /* ===== VIEWS ===== */
        const V = {
            ov() {
                const due = D.fus.filter(f => f.status == 'Pending' && f.due <= d(7)).length, rp = D.refs.filter(r => r.status == 'Pending').length, nm = D.cases.filter(c => c.cr.slice(0, 7) == T.slice(0, 7)).length;

                const chunkSize = 3;
                for (let i = 0; i < words.length; i += chunkSize) {
                    const chunk = words.slice(i, i + chunkSize).join(' ');
                    accumulated += (accumulated ? ' ' : '') + chunk;

                    c.scrollTop = c.scrollHeight;

            }

        // Haversine distance in km
        function haversineDistKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Verified Major Emergency Burn Centers Directory
        const CITY_HOSPITALS = {
            kanpur: [

                { name: 'PMCH Patna Medical College & Hospital', kind: 'hospital', lat: 25.6209, lon: 85.1636, burn_unit: true, major: true, phone: '0612-2300080' },
                { name: 'IGIMS Indira Gandhi Institute of Medical Sciences', kind: 'hospital', lat: 25.6175, lon: 85.0847, burn_unit: true, major: true, phone: '0612-2297099' }
            ]
        };
        const OVERPASS_URLS = [
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://overpass.private.coffee/api/interpreter'
        ];
        const hospitalCache = new Map();
        const placeCache = new Map();
        const IRRELEVANT_FACILITY = /\b(eye|netra|nethralaya|ophthalm|dental|dentist|urology|fertility|diagnostic|pathology|laboratory|veterinary|animal|psychiatr|rehab|cancer|oncology)\b/i;
        const CAMPUS_PART = /\b(block|wing|ward|building|gate)\b/i;
        const MAJOR_FACILITY = /\b(aiims|medical college|medical sciences|government|govt|sadar|district hospital|general hospital|civil hospital|referral hospital|pmch|igims|nmch)\b/i;
        const timedFetch = (url, options, timeoutMs = 12000) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...(options || {}), signal: controller.signal }).finally(() => clearTimeout(timer));
        };

        function hospitalTagText(tags) {
            return [tags.name, tags['name:en'], tags['healthcare:speciality'], tags.description].filter(Boolean).join(' ').toLowerCase();
        }

        function isBurnFacility(text) {
            return /burn|plastic.?surgery|plastic surgery/i.test(text);
        }

        async function overpassHospitals(lat, lon) {
            const query = `[out:json][timeout:25];(nwr["amenity"="hospital"](around:15000,${lat},${lon});nwr["amenity"="clinic"](around:15000,${lat},${lon});nwr["healthcare"="hospital"](around:15000,${lat},${lon}););out center tags 100;`;
            const requests = OVERPASS_URLS.map(url => timedFetch(url, {
                method: 'POST',
                body: new URLSearchParams({ data: query }),
                headers: { 'Accept': 'application/json' }
            }, 12000).then(r => r.ok ? r.json() : Promise.reject(new Error(`Overpass ${r.status}`))));
            try {
                return await Promise.any(requests);
            } catch (e) {
                return { elements: [] };
            }
        }

        async function nominatimHospitals(lat, lon) {
            const delta = 0.27;
            const params = new URLSearchParams({
                q: 'hospital',
                format: 'jsonv2',
                limit: '40',
                bounded: '1',
                extratags: '1',
                viewbox: `${lon - delta},${lat + delta},${lon + delta},${lat - delta}`
            });
            const r = await timedFetch(`https://nominatim.openstreetmap.org/search?${params}`, {
                headers: { 'Accept': 'application/json', 'Accept-Language': D.set.lang === 'hi' ? 'hi' : 'en' }
            }, 12000);
            if (!r.ok) throw new Error(`Nominatim hospitals ${r.status}`);
            return r.json();
        }

        async function reversePlace(lat, lon) {
            try {
                const params = new URLSearchParams({
                    lat: String(lat), lon: String(lon), format: 'jsonv2',
                    zoom: '18', addressdetails: '1'
                });
                const r = await timedFetch(`https://nominatim.openstreetmap.org/reverse?${params}`, {
                    headers: { 'Accept': 'application/json', 'Accept-Language': D.set.lang === 'hi' ? 'hi' : 'en' }
                }, 6000);
                if (!r.ok) return '';
                const data = await r.json();
                return data.display_name || '';
            } catch (e) {
                return '';
            }
        }

        function collectHospital(places, lat, lon, tags, plat, plon) {
            if (!tags || !Number.isFinite(plat) || !Number.isFinite(plon)) return;
            const name = tags.name || tags['name:en'];
            if (!name) return;
            const text = hospitalTagText({ ...tags, name });
            if ((IRRELEVANT_FACILITY.test(text) && !isBurnFacility(text)) || (CAMPUS_PART.test(name) && !/hospital|medical/i.test(name))) return;
            const kind = tags.amenity === 'hospital' || tags.healthcare === 'hospital' ? 'hospital' : 'clinic';
            const key = `${name.toLowerCase()}|${plat.toFixed(2)}|${plon.toFixed(2)}`;
            if (places.has(key)) return;
            places.set(key, {
                name,
                kind,
                lat: plat,
                lon: plon,
                distance_km: Math.round(haversineDistKm(lat, lon, plat, plon) * 10) / 10,
                phone: tags.phone || tags['contact:phone'] || '',
                burn_unit: isBurnFacility(text),
                major: MAJOR_FACILITY.test(text) || tags.emergency === 'yes',
                directions_url: `https://www.google.com/maps/dir/?api=1&destination=${plat},${plon}`
            });
        }

                        let areaName = '';
                        
                        try {

                            const rev = await timedFetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`, {
                                headers: { 'Accept': 'application/json', 'Accept-Language': L ? 'hi' : 'en' }
                            }, 8000);
                            if (rev.ok) {
                                const revData = await rev.json();
                                const a = revData.address || {};
                                areaName = a.suburb || a.neighbourhood || a.locality || a.city || a.town || a.county || '';
                                if (a.city && !areaName.includes(a.city)) areaName += (areaName ? ', ' : '') + a.city;
                            }
                        } catch (err) {}

                        removeTyping();
                        const displayPlace = areaName || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                        chat.push({ c: 'u', x: `${L ? 'मेरी लोकेशन' : 'Shared location'}: ${displayPlace}` });
                        chatInit();
                        hospLookup({ lat, lon, place: areaName || `${lat.toFixed(5)}, ${lon.toFixed(5)}` }); 
                    }, 
                    err => { 
                        removeTyping();
                        hospCityFallback(); 
                    }, 
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }

        function hospCityFallback() {
            const L = D.set.lang === 'hi';
            pushBot(

                (L ? 'अपने शहर, क्षेत्र या इलाके का नाम लिखें (उदा. Kalyanpur, Kanpur Nagar):' : 'Enter your city, area, or locality name (e.g. Kalyanpur, Kanpur):') + 
                '<div class="chat-bar" style="margin-top:8px">' +
                    '<input id="hcity" placeholder="e.g. Kalyanpur, Kanpur, Lucknow, Delhi" onkeydown="if(event.key==&quot;Enter&quot;)hospLookup({ place: this.value })" style="flex:1">' +
                    '<button class="sm" onclick="hospLookup({ place: document.getElementById(&quot;hcity&quot;).value })">' + (L ? 'खोजें' : 'Search') + '</button>' +
                '</div>' +
                '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">' +
                    ['Kalyanpur Kanpur', 'Kanpur', 'Lucknow', 'Delhi', 'Patna'].map(c => `<button class="s sm" onclick="hospLookup({ place: '${c}' })">${c}</button>`).join('') +
                '</div>',

        async function hospLookup(q) {
            const L = D.set.lang === 'hi'; 
            showTyping(L ? 'निकटतम अस्पताल व बर्न केयर सेंटर खोजे जा रहे हैं…' : 'Locating nearest hospitals & specialized burn centers…');
            
            let lat = q.lat;
            let lon = q.lon;
            let placeName = q.place || '';

            // 1. If coordinates not provided, geocode placeName via OpenStreetMap Nominatim
            if ((!lat || !lon) && placeName) {
                const cachedPlace = placeCache.get(placeName.trim().toLowerCase());
                if (cachedPlace) {
                    lat = cachedPlace.lat;
                    lon = cachedPlace.lon;
                    placeName = cachedPlace.name;
                } else try {
                    const geoRes = await timedFetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(placeName)}&format=json&limit=1&addressdetails=1&countrycodes=in`, {
                        headers: { 'Accept': 'application/json', 'Accept-Language': L ? 'hi' : 'en' }
                    }, 8000);
                    if (geoRes.ok) {
                        const geoArr = await geoRes.json();
                        if (geoArr && geoArr.length) {
                            lat = parseFloat(geoArr[0].lat);
                            lon = parseFloat(geoArr[0].lon);
                            if (geoArr[0].display_name) {
                                placeName = geoArr[0].display_name.split(',').slice(0, 3).join(',').trim();
                            }
                            placeCache.set(q.place.trim().toLowerCase(), { lat, lon, name: placeName });
                        }
                    }
                } catch (e) {}
            }

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                removeTyping();
                pushBot(L
                    ? 'यह स्थान सटीक रूप से नहीं मिला। कृपया शहर, क्षेत्र या लैंडमार्क का नाम दोबारा लिखें।'
                    : 'That place could not be located accurately. Please enter a city, area, or landmark again.');
                return;
            }

            if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(placeName)) {
                const resolvedPlace = await reversePlace(lat, lon);
                if (resolvedPlace) placeName = resolvedPlace;
            }

            const cacheKey = `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)}`;
            const cachedHospitals = hospitalCache.get(cacheKey);
            if (cachedHospitals) {
                removeTyping();
                renderHospitals(cachedHospitals, placeName, (L ? 'नज़दीकी अस्पताल व बर्न सेंटर्स' : 'Nearest Hospitals & Burn Centers'), '112 / 108');
                return;
            }

            let foundHospitals = [];

            const places = new Map();
            // Nominatim is fast enough for the first response. Overpass is retained
            // as a fallback because public Overpass mirrors can take several seconds.
            const nominatim = await nominatimHospitals(lat, lon).catch(() => []);
            (nominatim || []).forEach(item => {
                const tags = { ...(item.extratags || {}), name: item.name || '' };
                tags.amenity = item.type;
                collectHospital(places, lat, lon, tags, Number(item.lat), Number(item.lon));
            });
            if (!places.size) {
                const overpass = await overpassHospitals(lat, lon);
                (overpass.elements || []).forEach(el => {
                    const center = el.center || {};
                    collectHospital(places, lat, lon, el.tags || {}, Number(el.lat ?? center.lat), Number(el.lon ?? center.lon));
                });
            }
            foundHospitals = [...places.values()];

            // Merge verified centers only when the resolved place belongs to that city.
            const pLower = (placeName || '').toLowerCase();
            let cityKey = Object.keys(CITY_HOSPITALS).find(k => pLower.includes(k));
            if (!cityKey) {
                let nearestCity = null;
                let nearestDistance = Infinity;
                Object.entries(CITY_HOSPITALS).forEach(([key, centers]) => centers.forEach(center => {
                    const distance = haversineDistKm(lat, lon, center.lat, center.lon);
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearestCity = key;
                    }
                }));
                if (nearestDistance <= 50) cityKey = nearestCity;
            }
            if (cityKey && CITY_HOSPITALS[cityKey]) {
                CITY_HOSPITALS[cityKey].forEach(ch => {
                    const dKm = haversineDistKm(lat, lon, ch.lat, ch.lon);
                    if (!foundHospitals.some(fh => fh.name.toLowerCase().includes(ch.name.toLowerCase().slice(0, 10)))) {
                        foundHospitals.push({
                            name: ch.name, kind: 'hospital', distance_km: Math.round(dKm * 10) / 10,
                            burn_unit: ch.burn_unit, major: ch.major, phone: ch.phone,
                            lat: ch.lat, lon: ch.lon,
                            directions_url: `https://www.google.com/maps/dir/?api=1&destination=${ch.lat},${ch.lon}`
                        });
                    }
                });
            }

            foundHospitals.sort((a, b) => (a.kind !== 'hospital') - (b.kind !== 'hospital') || a.distance_km - b.distance_km);
            const topHospitals = foundHospitals.slice(0, 8);
            const extraHospitals = foundHospitals.slice(8).filter(p => p.burn_unit || p.major).sort((a, b) => Number(!a.burn_unit) - Number(!b.burn_unit) || a.distance_km - b.distance_km).slice(0, 3);
            const results = topHospitals.concat(extraHospitals);
            hospitalCache.set(cacheKey, results);

            removeTyping();
            renderHospitals(results, placeName, (L ? 'नज़दीकी अस्पताल व बर्न सेंटर्स' : 'Nearest Hospitals & Burn Centers'), '112 / 108');
        }

        function renderHospitals(places, where, title, emergencyLine) {
            const L = D.set.lang === 'hi';
            emergencyLine = emergencyLine || '112 / 108';
            let out = `<b>${title || (L ? 'नज़दीकी अस्पताल' : 'Nearby Hospitals')}</b> (${esc(where || (L ? 'आपका क्षेत्र' : 'Your Location'))})<br><br>`;
            
            if (!places || !places.length) {
                out += (L ? 'इस क्षेत्र में कोई अस्पताल नहीं मिला। कृपया आपातकालीन नंबर पर संपर्क करें।' : 'No verified hospitals found in this vicinity.');
            } else {
                places.forEach((p, idx) => {
                    const tag = p.burn_unit 
                        ? `<span style="background:#dc3545;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700">🔥 ${L ? 'विशेष बर्न यूनिट' : 'Specialized Burn Unit'}</span>` 
                        : (p.major ? `<span style="background:#0d6efd;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600">🏥 ${L ? '24x7 आपातकालीन' : '24x7 Emergency'}</span>` : '');
                    
                    const phoneHtml = p.phone ? `<a href="tel:${p.phone.replace(/[^0-9]/g, '')}" style="color:var(--navy);font-weight:600;text-decoration:none;margin-right:8px">${esc(p.phone)}</a>` : '';
                    const dirUrl = p.directions_url || (p.lat && p.lon ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + (where || ''))}`);

                    out += `<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px">
                        <div style="font-weight:700;color:var(--navy);font-size:14px;margin-bottom:4px">${idx + 1}. ${esc(p.name)}</div>
                        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:12px">
                            <span style="font-weight:600;color:#28a745">${p.distance_km} km away</span>
                            ${tag}
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;font-size:12px">
                            ${phoneHtml}
                            <a href="${dirUrl}" target="_blank" rel="noopener noreferrer" style="background:var(--blue);color:#fff;padding:4px 10px;border-radius:6px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px">
                                ${L ? 'रास्ता देखें (Maps)' : 'Directions'}
                            </a>
                        </div>
                    </div>`;
                });
            }
            
            out += `<div style="font-size:12px;color:var(--mut);margin-top:6px">${L ? 'गंभीर आपातकाल में तुरंत डायल करें:' : 'Critical emergency helpline:'} <b style="color:#dc3545">${emergencyLine}</b></div>`;
            pushBot(out, { html: 1 });
        }

        function parseHospitalQuery(text) {
            const facility = /\b(hospitals?|clinics?|burn\s+(?:cent(?:re|er)|unit|ward)|medical\s+cent(?:re|er)|aspatal|aspataal|haspatal)\b|अस्पताल|हॉस्पिटल|दवाखाना/i;
            const locator = /\b(near|nearby|nearest|close|closest|around|find|where|location|address|list|show|in|at|paas)\b|पास|नज़दीक|नजदीक|कहाँ|कहां|ढूंढ|बताओ/i;
            if (!facility.test(text) || !locator.test(text)) return { requested: false, place: '' };
            const selfLocation = /\b(near\s+me|nearby|my\s+location|current\s+location|here)\b|पास\s*के|नज़दीकी/i.test(text);
            if (selfLocation && !/\b(?:in|at|near|to)\s+[a-z]/i.test(text)) {
                const candidate = text
                    .replace(/\b(?:near\s+me|nearby|my\s+location|current\s+location|here|hospitals?|clinics?|burn\s+(?:cent(?:re|er)|unit|ward)|find|show|list)\b/gi, '')
                    .replace(/पास\s*के|नज़दीकी|अस्पताल|हॉस्पिटल|दवाखाना/gi, '')
                    .replace(/^(?:mujhe|mujhko|mere|mera|meri|please|plz)\s+/i, '')
                    .replace(/[?!.,]+$/g, '').replace(/\s+/g, ' ').trim();
                return { requested: true, place: candidate };
            }
            let place = '';
            const after = text.match(/\b(?:near|in|at|around)\s+(.+?)(?:\s+(?:for|please|pls|plz))?$/i);
            if (after) place = after[1].trim();
            if (/^(?:hospitals?|clinics?|burn\s+(?:cent(?:re|er)|unit|ward))$/i.test(place)) {
                place = '';
            }
            if (!place) {
                const beforeFacility = text.match(/^(.+?)\s+(?:near|around)\s+(?:the\s+)?(?:hospitals?|clinics?|burn\s+(?:cent(?:re|er)|unit|ward))\b/i);
                if (beforeFacility) place = beforeFacility[1].replace(/^(?:find|show|list)\s+/i, '').trim();
            }
            if (!place) {
                const toPlace = text.match(/\bto\s+(.+?)(?:\s+(?:for|please|pls|plz))?$/i);
                if (toPlace) place = toPlace[1].trim();
            }
            if (!place) {
                const before = text.match(/^(.+?)\s+(?:mein|me|mai|ke\s+paas|ke\s+nazdik|ke\s+nazdeek|के\s+पास|में)\s+/i);
                if (before) place = before[1].trim();
            }
            place = place
                .replace(/\b(?:find|show|list|hospitals?|clinics?|burn\s+(?:cent(?:re|er)|unit|ward)|please|pls|plz|mujhe|mujhko|mere|mera|meri)\b/gi, '')
                .replace(/[?!.,]+$/g, '').replace(/\s+/g, ' ').trim();
            if (!place || /^(me|my|here|this|the|nearby|पास|नज़दीकी)$/i.test(place)) return { requested: true, place: '' };
            return { requested: true, place };
        }

        let chatRequestActive = false;
        async function ask(q) {
            const inp = $('#ci'); 
            if (!q && inp) { q = inp.value; inp.value = ''; }
            q = (q || '').trim(); 
            if (!q) return;
            
            chat.push({ c: 'u', x: q }); 
            chatInit();
            
            const L = D.set.lang === 'hi';
            const qLower = q.toLowerCase();

            // 1. SMART QUERY INTERCEPTION: Detect Hospital Search Queries
            const hospitalQuery = parseHospitalQuery(q);
            if (hospitalQuery.requested) {
                if (hospitalQuery.place.length >= 2) {
                    hospLookup({ place: hospitalQuery.place });
                    return;
                } else {
                    aiHospitalGo();
                    return;
                }
            }

            // 2. Normal Burn Q&A
            showTyping(L ? 'CSJMU AI उत्तर तैयार कर रहा है…' : 'CSJMU AI is preparing answer…');
            
            if (chatRequestActive) return;
            chatRequestActive = true;
            try {
                const r = await timedFetch((API ? API : '') + '/api/chat', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ message: q, history: hist, lang: API_LANG() }) 
                }, 45000);
                if (!r.ok) throw new Error('API error');
                const d = await r.json();
                hist.push(['user', q], ['model', d.answer]); 
                if (hist.length > 12) hist = hist.slice(-12);
                
                await streamBotMessage(d.answer);
            } catch (e) { 
                removeTyping();
                // Intelligent evidence-based clinical guidance
                let ans = '';
                if (qLower.includes('cool') || qLower.includes('water') || qLower.includes('ठंडा') || qLower.includes('पानी')) {
                    ans = L 
                        ? 'जले हुए हिस्से को तुरंत नल के ठंडे बहते पानी में 20 मिनट तक रखें। बर्फ़ का इस्तेमाल कभी न करें, क्योंकि इससे त्वचा की कोशिकाएँ नष्ट हो सकती हैं।'
                        : 'Cool the burn immediately under cool, running tap water for 20 minutes. Never apply ice or ice water, as extreme cold damages healing tissue.';
                } else if (qLower.includes('blister') || qLower.includes('छाले') || qLower.includes('फोड़')) {
                    ans = L 
                        ? 'छालों को कभी न फोड़ें। छाले की त्वचा अंदर के घाव को संक्रमण से बचाने के लिए प्राकृतिक सुरक्षा कवच का काम करती है। यदि छाला फूट जाए तो साफ़ क्लिंग फ़िल्म से ढीला ढकें।'
                        : 'Never burst blisters. Blisters form a sterile protective barrier over damaged skin. If a blister breaks on its own, clean gently with mild soap and water, and cover loosely.';
                } else if (qLower.includes('colgate') || qLower.includes('toothpaste') || qLower.includes('haldi') || qLower.includes('oil') || qLower.includes('टूथपेस्ट')) {
                    ans = L 
                        ? 'जले स्थान पर टूथपेस्ट, तेल, घी, मक्खन, अंडा या हल्दी बिल्कुल न लगाएँ। ये चीजें त्वचा की गर्मी को अंदर रोक लेती हैं और गंभीर संक्रमण का कारण बनती हैं।'
                        : 'Do NOT apply toothpaste, butter, oil, egg, or turmeric to a burn. These trap heat inside the tissues and increase the risk of severe bacterial infection.';
                } else if (qLower.includes('chemical') || qLower.includes('acid') || qLower.includes('तेज़ाब')) {
                    ans = L 
                        ? 'केमिकल या तेज़ाब से जलने पर: सूखा केमिकल पाउडर झाड़ दें, केमिकल लगे कपड़े उतारें और कम से कम 20 मिनट तक लगातार साफ़ बहते पानी से धोएँ। तुरंत अस्पताल जाएँ।'
                        : 'Chemical burn protocol: brush off dry chemical powder, remove contaminated clothing, and irrigate with running water for at least 20 continuous minutes. Seek hospital care.';
                } else {
                    ans = L 
                        ? 'जलने पर तत्काल प्राथमिक उपचार: 1. जले हिस्से को 20 मिनट तक ठंडे बहते पानी से ठंडा करें। 2. अंगूठी व कपड़े तुरंत उतारें। 3. क्लिंग फ़िल्म से ढीला ढकें। 4. बर्फ़, टूथपेस्ट या घी न लगाएँ। आपातकाल में 112/108 डायल करें।'
                        : 'Immediate burn guidance: 1. Cool under clean running water for 20 minutes. 2. Remove rings, watches and loose clothing. 3. Cover loosely with sterile plastic cling film. 4. Never apply ice, butter, or toothpaste. In emergency, call 112/108.';
                }
                hist.push(['user', q], ['model', ans]);
                await streamBotMessage(ans);
            } finally {
                chatRequestActive = false;
            }
        }
        /* ===== 10. INIT ===== */
        draw();
        let ip; addEventListener('beforeinstallprompt', e => { e.preventDefault(); ip = e; $('#ib').style.display = '' });
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
    </script>
