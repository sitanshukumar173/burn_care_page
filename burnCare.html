<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BurnCare — Prototype</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#12345A">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --navy: #12345A;
            --blue: #1769AA;
            --red: #D9363E;
            --bg: #F4F7FB;
            --ink: #1d2a3a;
            --mut: #5d6b7c;
            --line: #dde4ee;
            --ok: #1f8a5b;
            --warn: #b7791f
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg)
        }

        #ban {
            background: var(--red);
            color: #fff;
            text-align: center;
            font-weight: 600;
            padding: 5px 10px;
            font-size: 12.5px
        }

        #app {
            display: flex;
            min-height: calc(100vh - 28px)
        }

        aside {
            width: 224px;
            background: var(--navy);
            color: #cfe0f3;
            padding: 12px 0;
            flex-shrink: 0
        }

        aside a {
            display: block;
            padding: 9px 20px;
            cursor: pointer;
            color: #cfe0f3;
            border-left: 3px solid transparent
        }

        aside a:hover {
            background: #1b4574
        }

        aside a.on {
            background: #1b4574;
            color: #fff;
            border-color: var(--red);
            font-weight: 600
        }

        .main {
            flex: 1;
            min-width: 0
        }

        header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 20px;
            flex-wrap: wrap
        }

        header img {
            height: 38px
        }

        header .sp {
            flex: 1
        }

        #burger {
            display: none
        }

        .pill {
            background: #eaf2fb;
            color: var(--navy);
            border-radius: 20px;
            padding: 3px 11px;
            font-size: 12px
        }

        section {
            padding: 22px;
            max-width: 1200px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            color: var(--navy)
        }

        h3 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: 15px
        }

        .sub {
            color: var(--mut);
            margin-bottom: 16px
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g5 {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .kpi b {
            display: block;
            font-size: 28px;
            color: var(--blue)
        }

        .kpi span {
            color: var(--mut);
            font-size: 12.5px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        th {
            color: var(--mut);
            font-weight: 600;
            font-size: 12.5px
        }

        tr.cl:hover {
            background: #f0f6fd;
            cursor: pointer
        }

        .tw {
            overflow-x: auto
        }

        button,
        .btn {
            background: var(--blue);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 7px 14px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        button:hover {
            background: var(--navy)
        }

        button.s {
            background: #fff;
            color: var(--blue);
            border: 1px solid var(--blue)
        }

        button.d {
            background: var(--red)
        }

        button.sm {
            padding: 3px 9px;
            font-size: 12.5px
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        aside a:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 1px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #c3cfdf;
            border-radius: 6px;
            font: inherit;
            background: #fff
        }

        label {
            display: block;
            font-weight: 600;
            margin: 10px 0 3px;
            font-size: 12.5px;
            color: var(--navy)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px
        }

        .row>* {
            flex: 1;
            min-width: 140px
        }

        .row>button {
            flex: 0 0 auto
        }

        .st {
            display: inline-block;
            border-radius: 12px;
            padding: 1px 9px;
            font-size: 12px;
            font-weight: 600;
            background: #e6edf6;
            color: var(--navy)
        }

        .st.New {
            background: #e1efff;
            color: var(--blue)
        }

        .st.Referred,
        .st.Overdue {
            background: #fde8e9;
            color: var(--red)
        }

        .st.Closed,
        .st.Completed,
        .st.Approved {
            background: #e2f4ec;
            color: var(--ok)
        }

        .st.Pending,
        .st.Draft,
        .st.Follow-up\ Required,
        .st.Under\ Review {
            background: #fdf1dc;
            color: var(--warn)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0
        }

        .bar i {
            display: block;
            height: 14px;
            background: var(--blue);
            border-radius: 3px;
            min-width: 3px
        }

        .bar span {
            width: 130px;
            font-size: 12.5px;
            color: var(--mut)
        }

        .tag {
            font-size: 11px;
            border: 1px dashed var(--mut);
            color: var(--mut);
            border-radius: 4px;
            padding: 0 5px;
            margin-left: 6px
        }

        #chat {
            height: 420px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px
        }

        .msg {
            max-width: 82%;
            padding: 9px 13px;
            border-radius: 12px;
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word
        }

        .msg.u {
            background: var(--blue);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 2px
        }

        .msg.b {
            background: #eef3f9;
            border-bottom-left-radius: 2px
        }

        .msg.em {
            background: #fde8e9;
            border: 2px solid var(--red);
            color: #7a141a;
            font-weight: 600
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 14px;
            background: #eef3f9;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            margin: 8px 0;
            width: fit-content
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            display: inline-block;
            animation: bounceDot 1.4s infinite ease-in-out both
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s }
        .typing-dot:nth-child(2) { animation-delay: -0.16s }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4 }
            40% { transform: scale(1); opacity: 1 }
        }

        .typing-text {
            font-size: 12px;
            color: var(--mut);
            margin-left: 6px;
            font-style: italic
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: var(--navy);
            margin-left: 2px;
            vertical-align: middle;
            animation: blinkCur 0.8s infinite
        }

        @keyframes blinkCur { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

        .chat-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px
        }

        .action-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0
        }

        .action-tray .chip {
            margin: 0;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04)
        }

        .action-tray .chip:hover {
            background: var(--blue);
            color: #fff
        }

        .src {
            display: block;
            font-size: 11.5px;
            color: var(--mut);
            margin-top: 5px;
            font-weight: 400
        }

        .chip {
            display: inline-block;
            border: 1px solid var(--blue);
            color: var(--blue);
            border-radius: 16px;
            padding: 3px 11px;
            margin: 3px 4px 3px 0;
            cursor: pointer;
            font-size: 12.5px;
            background: #fff
        }

        .warn {
            background: #fff4f4;
            border-left: 4px solid var(--red);
            padding: 9px 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px
        }

        #mod {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 45, .55);
            display: none;
            align-items: flex-start;
            justify-content: center;
            overflow: auto;
            z-index: 20;
            padding: 30px 10px
        }

        #mod .box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            width: min(600px, 100%)
        }

        #mod .err {
            color: var(--red);
            font-size: 12.5px
        }

        #toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: var(--navy);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            display: none;
            z-index: 30
        }

        #toast.e {
            background: var(--red)
        }

        .bm [data-n] {
            fill: url(#sk);
            stroke: #6f86a3;
            stroke-width: 1.2;
            cursor: pointer
        }

        .bm [data-n]:hover {
            stroke: var(--blue);
            stroke-width: 2.2
        }

        .bm .sel {
            fill: url(#sr);
            stroke: var(--red)
        }

        .tl {
            border-left: 3px solid var(--line);
            margin-left: 6px;
            padding-left: 14px
        }

        .tl div {
            margin-bottom: 10px;
            position: relative
        }

        .tl div:before {
            content: "";
            position: absolute;
            left: -21px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--blue)
        }

        #pr {
            display: none
        }

        @media(max-width:800px) {
            aside {
                position: fixed;
                left: -240px;
                top: 28px;
                bottom: 0;
                z-index: 10;
                transition: left .2s
            }

            aside.open {
                left: 0
            }

            #burger {
                display: block
            }
        }

        @media print {
            body * {
                visibility: hidden
            }

            #pr,
            #pr * {
                visibility: visible
            }

            #pr {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #fff
            }

            #ban {
                display: none
            }
        }
    </style>
</head>

<body>
    <div id="ban">PROTOTYPE — DEMO DATA ONLY — NOT FOR REAL PATIENT CARE</div>
    <div id="app">
        <aside id="nav"></aside>
        <div class="main">
            <header><button id="burger" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><b
                    style="font-size:21px;color:var(--navy);letter-spacing:.3px">BurnCare</b><span class="pill"
                    id="hn"></span><span class="sp"></span><span class="pill" title="Demo notifications">🔔 <span
                        id="nn"></span> demo alerts</span><span class="pill" id="un"></span><button id="ib" class="sm"
                    style="display:none" onclick="ip.prompt()">Install app</button></header>
            <section id="v"></section>
        </div>
    </div>
    <div id="mod">
        <div class="box" id="mb"></div>
    </div>
    <div id="toast"></div>
    <div id="pr"></div>
    <script>
        /* ===== 4. DATA MODEL & 9. PERSISTENCE ===== */
        const K = 'mbc_v1', $ = s => document.querySelector(s), d = n => { let x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) }, T = d(0);
        const ST = ['New', 'Under Review', 'Follow-up Required', 'Referred', 'Closed'], REG = { front: ['Head', 'Neck', 'Chest', 'Abdomen', 'Right Arm', 'Left Arm', 'Right Hand', 'Left Hand', 'Right Thigh', 'Left Thigh', 'Right Leg', 'Left Leg', 'Right Foot', 'Left Foot', 'Genitalia'], back: ['Head (back)', 'Neck (back)', 'Upper Back', 'Lower Back', 'Right Arm (back)', 'Left Arm (back)', 'Right Hand (back)', 'Left Hand (back)', 'Right Thigh (back)', 'Left Thigh (back)', 'Right Calf', 'Left Calf', 'Right Foot (back)', 'Left Foot (back)', 'Buttocks'] };
        function seed() {
            return {
                set: { hosp: 'Demo Hospital — Sample Data', user: 'Dr. Demo Clinician (fictional)', lang: 'en' },
                pts: [{ id: 'P-1001', name: 'Asha Verma (fictional)', age: 34, sex: 'F', clin: 'Dr. A. Sharma' }, { id: 'P-1002', name: 'Rohan Mehta (fictional)', age: 8, sex: 'M', clin: 'Dr. K. Iyer' }, { id: 'P-1003', name: 'Sunita Rao (fictional)', age: 52, sex: 'F', clin: 'Dr. A. Sharma' }],
                cases: [{ id: 'C-2001', pid: 'P-1001', cr: d(-20), inj: d(-21) + 'T18:30', mech: 'Hot liquid scald', reg: ['Left Hand', 'Left Arm'], assess: 'Entered by clinician: partial area involvement, dressing applied.', clin: 'Dr. A. Sharma', fu: d(2), status: 'Follow-up Required', notes: [{ t: d(-20), by: 'Dr. A. Sharma', x: 'Initial review. Plan: dressing and review as set by clinician.' }] },
                { id: 'C-2002', pid: 'P-1002', cr: d(-6), inj: d(-6) + 'T09:10', mech: 'Flame', reg: ['Right Thigh'], assess: '', clin: 'Dr. K. Iyer', fu: d(-1), status: 'Referred', notes: [] },
                { id: 'C-2003', pid: 'P-1003', cr: d(-45), inj: d(-46) + 'T20:00', mech: 'Chemical', reg: ['Chest'], assess: 'Entered by clinician: reviewed, healing documented.', clin: 'Dr. A. Sharma', fu: '', status: 'Closed', notes: [{ t: d(-30), by: 'Dr. A. Sharma', x: 'Healing documented. Discharged from active follow-up.' }] }],
                fus: [{ id: 'F-1', cid: 'C-2001', clin: 'Dr. A. Sharma', due: d(2), status: 'Pending', notes: 'Wound review' }, { id: 'F-2', cid: 'C-2002', clin: 'Dr. K. Iyer', due: d(-1), status: 'Pending', notes: 'Post-referral check' }, { id: 'F-3', cid: 'C-2003', clin: 'Dr. A. Sharma', due: d(-30), status: 'Completed', notes: 'Final review' }],
                refs: [{ id: 'R-1', cid: 'C-2002', from: 'Demo Hospital — Sample Data', to: 'Demo Burn Centre (fictional)', reason: 'Specialist burn-unit review requested by clinician.', notes: 'Fictional demo referral.', date: d(-5), status: 'Pending' }],
                kb: [{ id: 'K-1', title: 'Immediate first aid (sample)', cat: 'First aid', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-2', title: 'When to seek urgent care (sample)', cat: 'Emergency escalation', src: 'Sample — pending clinician review', rev: d(-10), st: 'Under Review' }, { id: 'K-3', title: 'Follow-up purpose (sample)', cat: 'Follow-up education', src: 'Demo Hospital (fictional)', rev: d(-3), st: 'Draft' }]
            }
        }
        let D; try { D = JSON.parse(localStorage.getItem(K)) || seed() } catch (e) { D = seed() }
        const save = () => { try { localStorage.setItem(K, JSON.stringify(D)) } catch (e) { } };
        const nid = (p, a) => p + ((Math.max(0, ...a.map(x => parseInt(x.id.split('-')[1]) || 0))) + 1);
        const pn = id => (D.pts.find(p => p.id == id) || {}).name || id, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const st = s => `<span class="st ${s}">${s}</span>`;
        function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = e ? 'e' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600) }
        /* ===== 5. FORMS & VALIDATION ===== */
        function modal(title, fields, vals, cb) {
            vals = vals || {};
            $('#mb').innerHTML = `<h3>${title}</h3><form id="f" onsubmit="return false">` + fields.map(f => {
                const v = vals[f.k] ?? f.v ?? ''; let i;
                if (f.t == 'select') i = `<select name="${f.k}">${f.o.map(o => { o = [].concat(o); return `<option value="${esc(o[0])}" ${o[0] == v ? 'selected' : ''}>${esc(o[1] ?? o[0])}</option>` }).join('')}</select>`;
                else if (f.t == 'textarea') i = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
                else i = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}">`;
                return `<label>${f.l}${f.req ? ' *' : ''}</label>${i}`
            }).join('') + `<p class="err" id="er"></p><div class="row"><button id="sv">Save</button><button class="s" onclick="closeM()">Cancel</button></div></form>`;
            $('#mod').style.display = 'flex';
            $('#sv').onclick = () => { const o = {}; new FormData($('#f')).forEach((v, k) => o[k] = v.trim()); const m = fields.filter(f => f.req && !o[f.k]); if (m.length) { $('#er').textContent = 'Please complete: ' + m.map(f => f.l).join(', '); return } cb(o); closeM() }
        }
        const closeM = () => $('#mod').style.display = 'none';
        const caseOpts = () => D.cases.map(c => [c.id, c.id + ' — ' + pn(c.pid)]), ptOpts = () => D.pts.map(p => [p.id, p.name]);
        /* ===== 3. NAVIGATION ===== */
        const NAV = [['ov', 'Overview'], ['ai', 'BurnCare AI'], ['pt', 'Patients'], ['cs', 'Burn Cases'], ['bm', 'Digital Body Map'], ['fu', 'Follow-ups'], ['rf', 'Referrals'], ['an', 'Hospital Analytics'], ['kc', 'Knowledge Centre'], ['se', 'Settings']];
        let cur = 'ov', sel = { pid: null, cid: null }, flt = { q: '', s: '' };
        function go(v, x) { cur = v; tb = null; bmSel = null; if (x) Object.assign(sel, x); flt = { q: '', s: '' }; nav.classList.remove('open'); draw() }
        function draw() {
            $('#nav').innerHTML = NAV.map(n => `<a tabindex="0" class="${n[0] == cur ? 'on' : ''}" onclick="go('${n[0]}')" onkeydown="if(event.key=='Enter')go('${n[0]}')">${n[1]}</a>`).join('');
            $('#hn').textContent = D.set.hosp; $('#un').textContent = D.set.user; $('#nn').textContent = D.fus.filter(f => f.status == 'Pending' && f.due < T).length;
            $('#v').innerHTML = V[cur](); if (cur == 'ai') chatInit(); if (cur == 'bm') { bmInit(); tbInit() }
        }
        const head = (t, s, b) => `<div class="row"><div><h1>${t}</h1><div class="sub">${s || ''}</div></div>${b || ''}</div>`;
        const bars = o => { const m = Math.max(1, ...Object.values(o)); return Object.entries(o).map(([k, v]) => `<div class="bar"><span>${k}</span><i style="width:${v / m * 60}%"></i><b>${v}</b></div>`).join('') };
        const cnt = (a, f) => a.reduce((o, x) => (o[f(x)] = (o[f(x)] || 0) + 1, o), {});
        const doc = () => D.cases.length ? Math.round(D.cases.filter(c => c.assess && c.notes.length).length / D.cases.length * 100) : 0;
        /* ===== VIEWS ===== */
        const V = {
            ov() {
                const due = D.fus.filter(f => f.status == 'Pending' && f.due <= d(7)).length, rp = D.refs.filter(r => r.status == 'Pending').length, nm = D.cases.filter(c => c.cr.slice(0, 7) == T.slice(0, 7)).length;
                return head('Overview', 'Demo Hospital — Sample Data. All figures are sample/demo data.', `<button onclick="caseForm()">New case</button><button class="s" onclick="go('ai')">Open BurnCare AI</button><button class="s" onclick="go('rf')">Generate referral</button>`) +
                    `<div class="grid g5">${[['Total demo cases', D.cases.length], ['New this month', nm], ['Follow-ups due (7 days)', due], ['Referrals pending', rp], ['Documentation complete', doc() + '%']].map(k => `<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div><br>
<div class="grid g2"><div class="card"><h3>Recent case activity</h3>${D.cases.slice(-4).reverse().map(c => `<p><a href="#" onclick="go('cs',{cid:'${c.id}'});return false">${c.id}</a> ${esc(pn(c.pid))} ${st(c.status)}</p>`).join('') || 'No cases yet.'}</div>
<div class="card"><h3>Upcoming follow-ups</h3>${D.fus.filter(f => f.status == 'Pending').sort((a, b) => a.due > b.due ? 1 : -1).slice(0, 4).map(f => `<p>${f.due} — ${f.cid} ${f.due < T ? st('Overdue') : ''}</p>`).join('') || 'None.'}</div>
<div class="card"><h3>Cases by status (sample)</h3>${bars(cnt(D.cases, c => c.status))}</div><div class="card"><h3>Referral status (sample)</h3>${bars(cnt(D.refs, r => r.status))}</div></div>`
            },
            ai() {
                const L = D.set.lang == 'hi'; 
                return head('BurnCare AI', (L ? 'लाइव AI — CSJMU BurnCare Saathi (AWS बैकएंड)' : 'Live AI — CSJMU BurnCare Saathi (AWS Backend)'), 
                    `<button class="s" onclick="D.set.lang=D.set.lang=='hi'?'en':'hi';save();stringsP=null;hist=[];draw()">${L ? 'English' : 'हिन्दी'}</button>` +
                    `<button class="s" onclick="apiConfigModal()">⚙️ API</button>` +
                    `<button class="s" onclick="chat=[];hist=[];chatInit()">${L ? 'बातचीत साफ़ करें' : 'Clear chat'}</button>`) +

                const r = await fetch(API + '/api/photo', { method: 'POST', body: fd }); 
                if (!r.ok) throw new Error('Photo API ' + r.status); 
                const d = await r.json();
                removeTyping();
                
                if (!d.is_burn) { 
                    pushBot(S().not_burn || (L ? 'इस तस्वीर में जलने की कोई चोट नहीं मिली।' : 'No burn injury was detected in this photo.')); 
                    return; 
                }
                
                mergeFindings(d.regions); 
                caseCirc = caseCirc || !!d.circumferential; 
                caseDesc = d.description || ''; 
                caseRed = d.red_flags || [];
                
                if (d.description) {
                    await streamBotMessage(d.description);
                }
                if ((d.red_flags || []).length) {
                    pushBot('<b>⚠ ' + (L ? 'पहचाने गए महत्वपूर्ण लक्षण' : 'Clinical Flags Identified') + '</b><br>' + d.red_flags.map(f => '• ' + esc(f)).join('<br>'), { html: 1 });
                }
                if (!caseAge) {
                    askAge(); 
                } else {
                    assessNow();
                }
            } catch (e) { 
                removeTyping();
                pushBot(S().photo_failed || (L ? 'फ़ोटो का विश्लेषण नहीं किया जा सका। कृपया बैकएंड कनेक्शन जाँचें।' : 'Could not analyse the photo right now. Please verify backend connection.')); 
            }
        }

        function askAge() {
            const L = D.set.lang == 'hi';
            const opts = S().age_options || FALLBACK_AGE;
            pushBot(
                esc(S().age_question || (L ? 'मरीज़ की उम्र क्या है? (Lund & Browder TBSA के लिए आवश्यक)' : 'How old is the burned person? (Required for Lund & Browder TBSA)')) + 
                '<div style="margin-top:8px">' + 
                    opts.map(o => `<button class="s sm" style="margin:2px" onclick="setAge('${o.value}')">${esc(o.label)}</button> `).join('') + 
                '</div>', 
                { html: 1 }
            );
        }

        function setAge(v) { 
            caseAge = v; 
            const lbl = ((S().age_options || FALLBACK_AGE).find(o => o.value === v) || {}).label || v; 
            chat.push({ c: 'u', x: String(lbl) }); 
            chatInit(); 
            assessNow(); 
        }

        async function assessNow() {
            const L = D.set.lang == 'hi'; 
            showTyping(L ? 'Lund & Browder TBSA व क्लिनिकल ट्राइएज की गणना हो रही है…' : 'Calculating Lund & Browder TBSA & Clinical Triage…');
            try {
                const r = await fetch(API + '/api/assess', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ burns: caseBurns, age: caseAge, circumferential: caseCirc, lang: API_LANG(), description: caseDesc, red_flags: caseRed }) 
                });
                if (!r.ok) throw new Error('Assess API ' + r.status); 
                const d = await r.json(); 
                lastTbsa = d.tbsa;
                removeTyping();
                
                pushBot(d.report_text, { html: 1, cls: d.level === 'emergency' ? 'em' : 'b' });
                pushBot(
                    '<div class="action-tray" style="margin-top:6px">' +
                        '<span class="chip" onclick="aiPhotoAgain()">➕ ' + (L ? 'अन्य क्षेत्र जोड़ें' : 'Add another area') + '</span>' +
                        '<span class="chip" onclick="aiHospitalGo()">📍 ' + (L ? 'नज़दीकी अस्पताल' : 'Nearby hospitals') + '</span>' +
                        '<span class="chip" onclick="parklandGo()">💧 Parkland</span>' +
                        '<span class="chip" onclick="resetCase()">🔄 ' + (L ? 'नया केस' : 'New case') + '</span>' +
                    '</div>', 
                    { html: 1 }
                );
            } catch (e) { 
                removeTyping();
                pushBot(S().generic_error || (L ? 'मूल्यांकन में त्रुटि हुई।' : 'Could not complete clinical assessment.')); 
            }
        }

        function aiHospitalGo() {
            const L = D.set.lang == 'hi';
            if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
                showTyping(L ? 'डिवाइस लोकेशन प्राप्त की जा रही है…' : 'Detecting GPS location…');
                navigator.geolocation.getCurrentPosition(
                    p => { 
                        removeTyping();
                        chat.push({ c: 'u', x: L ? '📍 मेरी लोकेशन साझा की' : '📍 Shared current location' });
                        chatInit();
                        hospLookup({ lat: p.coords.latitude, lon: p.coords.longitude }); 
                    }, 
                    err => { 
                        removeTyping();
                        hospCityFallback(); 
                    }, 
                    { timeout: 8000, maximumAge: 60000 }
                );
            } else {
                hospCityFallback();
            }
        }

        function hospCityFallback() {
            const L = D.set.lang == 'hi';
            pushBot(
                '<b>📍 ' + (L ? 'नज़दीकी अस्पताल खोजें' : 'Find Nearby Hospitals') + '</b><br>' +
                (L ? 'कृपया अपने शहर, ज़िले या पिनकोड का नाम लिखें:' : 'Type a city, district, or pincode:') + 
                '<div class="chat-bar" style="margin-top:8px">' +
                    '<input id="hcity" placeholder="e.g. Kanpur, Lucknow, Patna, Delhi" onkeydown="if(event.key==&quot;Enter&quot;)hospLookup({ place: this.value })" style="flex:1">' +
                    '<button class="sm" onclick="hospLookup({ place: document.getElementById(&quot;hcity&quot;).value })">' + (L ? 'खोजें' : 'Search') + '</button>' +
                '</div>' +
                '<div style="margin-top:6px">' +
                    ['Kanpur', 'Lucknow', 'Patna', 'Delhi'].map(c => `<span class="chip" onclick="hospLookup({ place: '${c}' })">${c}</span>`).join('') +
                '</div>',
                { html: 1 }
            );
        }

        async function hospLookup(q) {
            const L = D.set.lang == 'hi'; 
            showTyping(L ? 'ओपनस्ट्रीटमैप से अस्पताल व बर्न सेंटर खोजे जा रहे हैं…' : 'Searching OpenStreetMap for nearby hospitals & burn units…');
            try {
                const r = await fetch(API + '/api/hospitals', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(q) 
                });
                if (!r.ok) throw new Error('Hospital API ' + r.status); 
                const d = await r.json();
                removeTyping();
                
                if (!d.ok) { 
                    pushBot(d.message || (L ? 'स्थान नहीं मिला।' : 'Could not find that location.')); 
                    return; 
                }
                
                let h = '<b>' + esc(d.title || ('Hospitals near ' + (d.where || 'you'))) + '</b><br>' +
                        '<b style="color:var(--red)">' + (d.emergency_line || '🚨 Emergency: 112 / 108') + '</b><br><br>';
                
                if (!d.places || !d.places.length) {
                    h += esc(d.no_hospitals || 'No specialized burn facilities found within 30 km.');
                } else {
                    d.places.forEach(p => {
                        const tags = (p.burn_unit ? ' <span class="tag" style="background:#fde8e9;color:var(--red);border-color:var(--red);font-weight:600">' + esc(d.tag_burn || 'Burn Unit') + '</span>' : '') + 
                                     (p.major ? ' <span class="tag" style="background:#eaf2fb;color:var(--navy)">' + esc(d.tag_major || 'Government / Teaching') + '</span>' : '');
                        h += '<b>' + esc(p.name) + '</b>' + tags + '<br>' + 
                             esc(p.kind == 'hospital' ? (d.kind_hospital || 'Hospital') : (d.kind_clinic || 'Clinic')) + 
                             ' · <b>' + p.distance_km + ' km</b>' + 
                             (p.phone ? ' · 📞 <a href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a>' : '') + 
                             ' · <a href="' + esc(p.directions_url) + '" target="_blank" rel="noopener">🗺️ ' + esc(d.directions || 'Get Directions') + '</a><br><br>';
                    });
                }
                if (d.footer) h += '<small style="color:var(--mut)">' + esc(d.footer) + '</small>';
                pushBot(h, { html: 1 });
            } catch (e) { 
                removeTyping();
                pushBot(S().map_down || (L ? 'अस्पताल खोज सेवा वर्तमान में उपलब्ध नहीं है।' : 'Hospital mapping service is currently unavailable.')); 
            }
        }

        function parklandGo() {
            const have = !!(caseBurns.length && caseAge && lastTbsa != null); const tbsa = have ? lastTbsa : '';
            const fields = [{ k: 'w', l: 'Weight (kg)', t: 'number', req: 1 }];
            if (!have) fields.push({ k: 'tbsa', l: 'TBSA %', t: 'number', req: 1 });
            modal('Parkland formula — clinician reference', fields, { tbsa: String(tbsa) }, o => {
                const w = +o.w, tb = have ? lastTbsa : +o.tbsa;
                if (!(w >= 1 && w <= 300)) { toast('Enter a valid weight (1–300 kg)', 1); return; }
                if (!(tb >= 0 && tb <= 100)) { toast('Enter TBSA between 0 and 100', 1); return; }
                showTyping('Calculating Parkland fluid formula…');
                fetch(API + '/api/parkland', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ weight_kg: w, tbsa: tb, age_group: caseAge || 'adult' }) 
                })
                .then(r => { if (!r.ok) throw 0; return r.json(); })
                .then(d => {
                    removeTyping();
                    pushBot(esc(d.text || 'Error'));
                })
                .catch(() => {
                    removeTyping();
                    toast('Parkland calculation unavailable — bridge not reachable', 1);
                });
            });
        }
        /* ===== 10. INIT ===== */
        draw();
        let ip; addEventListener('beforeinstallprompt', e => { e.preventDefault(); ip = e; $('#ib').style.display = '' });
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
    </script>
</body>

</html>
