<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BurnCare — Prototype</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12345A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#12345A;--blue:#1769AA;--red:#D9363E;--bg:#F4F7FB;--ink:#1d2a3a;--mut:#5d6b7c;--line:#dde4ee;--ok:#1f8a5b;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#ban{background:var(--red);color:#fff;text-align:center;font-weight:600;padding:5px 10px;font-size:12.5px}
#app{display:flex;min-height:calc(100vh - 28px)}
aside{width:224px;background:var(--navy);color:#cfe0f3;padding:12px 0;flex-shrink:0}
aside a{display:block;padding:9px 20px;cursor:pointer;color:#cfe0f3;border-left:3px solid transparent}
aside a:hover{background:#1b4574}aside a.on{background:#1b4574;color:#fff;border-color:var(--red);font-weight:600}
.main{flex:1;min-width:0}
header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
header img{height:38px}header .sp{flex:1}
#burger{display:none}
.pill{background:#eaf2fb;color:var(--navy);border-radius:20px;padding:3px 11px;font-size:12px}
section{padding:22px;max-width:1200px}h1{margin:0 0 4px;font-size:22px;color:var(--navy)}h3{margin:0 0 10px;color:var(--navy);font-size:15px}
.sub{color:var(--mut);margin-bottom:16px}.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.kpi b{display:block;font-size:28px;color:var(--blue)}.kpi span{color:var(--mut);font-size:12.5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12.5px}
tr.cl:hover{background:#f0f6fd;cursor:pointer}.tw{overflow-x:auto}
button,.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
button:hover{background:var(--navy)}button.s{background:#fff;color:var(--blue);border:1px solid var(--blue)}button.d{background:var(--red)}button.sm{padding:3px 9px;font-size:12.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,aside a:focus-visible{outline:2px solid var(--red);outline-offset:1px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #c3cfdf;border-radius:6px;font:inherit;background:#fff}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:12.5px;color:var(--navy)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
.st{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;background:#e6edf6;color:var(--navy)}
.st.New{background:#e1efff;color:var(--blue)}.st.Referred,.st.Overdue{background:#fde8e9;color:var(--red)}.st.Closed,.st.Completed,.st.Approved{background:#e2f4ec;color:var(--ok)}.st.Pending,.st.Draft,.st.Follow-up\ Required,.st.Under\ Review{background:#fdf1dc;color:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar i{display:block;height:14px;background:var(--blue);border-radius:3px;min-width:3px}.bar span{width:130px;font-size:12.5px;color:var(--mut)}
.tag{font-size:11px;border:1px dashed var(--mut);color:var(--mut);border-radius:4px;padding:0 5px;margin-left:6px}
#chat{height:380px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.msg.u{background:var(--blue);color:#fff;margin-left:auto}.msg.b{background:#eef3f9}.msg.em{background:#fde8e9;border:2px solid var(--red);color:#7a141a;font-weight:600}
.src{display:block;font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:400}
.chip{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:3px 11px;margin:3px 4px 3px 0;cursor:pointer;font-size:12.5px;background:#fff}
.warn{background:#fff4f4;border-left:4px solid var(--red);padding:9px 12px;border-radius:4px;margin:10px 0;font-size:13px}
#mod{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:30px 10px}
#mod .box{background:#fff;border-radius:10px;padding:20px;width:min(600px,100%)}#mod .err{color:var(--red);font-size:12.5px}
#toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:30}#toast.e{background:var(--red)}
.bm [data-n]{fill:url(#sk);stroke:#6f86a3;stroke-width:1.2;cursor:pointer}.bm [data-n]:hover{stroke:var(--blue);stroke-width:2.2}.bm .sel{fill:url(#sr);stroke:var(--red)}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
#pr{display:none}
@media(max-width:800px){aside{position:fixed;left:-240px;top:28px;bottom:0;z-index:10;transition:left .2s}aside.open{left:0}#burger{display:block}}
@media print{body *{visibility:hidden}#pr,#pr *{visibility:visible}#pr{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff}#ban{display:none}}
</style></head><body>
<div id="ban">PROTOTYPE — DEMO DATA ONLY — NOT FOR REAL PATIENT CARE</div>
<div id="app"><aside id="nav"></aside><div class="main"><header><button id="burger" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><b style="font-size:21px;color:var(--navy);letter-spacing:.3px">BurnCare</b><span class="pill" id="hn"></span><span class="sp"></span><span class="pill" title="Demo notifications">🔔 <span id="nn"></span> demo alerts</span><span class="pill" id="un"></span><button id="ib" class="sm" style="display:none" onclick="ip.prompt()">Install app</button></header><section id="v"></section></div></div>
<div id="mod"><div class="box" id="mb"></div></div><div id="toast"></div><div id="pr"></div>
<script>
/* ===== 4. DATA MODEL & 9. PERSISTENCE ===== */
const K='mbc_v1',$=s=>document.querySelector(s),d=n=>{let x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},T=d(0);
const ST=['New','Under Review','Follow-up Required','Referred','Closed'],REG={front:['Head','Neck','Chest','Abdomen','Right Arm','Left Arm','Right Hand','Left Hand','Right Thigh','Left Thigh','Right Leg','Left Leg','Right Foot','Left Foot','Genitalia'],back:['Head (back)','Neck (back)','Upper Back','Lower Back','Right Arm (back)','Left Arm (back)','Right Hand (back)','Left Hand (back)','Right Thigh (back)','Left Thigh (back)','Right Calf','Left Calf','Right Foot (back)','Left Foot (back)','Buttocks']};
function seed(){return{set:{hosp:'Demo Hospital — Sample Data',user:'Dr. Demo Clinician (fictional)',lang:'en'},
pts:[{id:'P-1001',name:'Asha Verma (fictional)',age:34,sex:'F',clin:'Dr. A. Sharma'},{id:'P-1002',name:'Rohan Mehta (fictional)',age:8,sex:'M',clin:'Dr. K. Iyer'},{id:'P-1003',name:'Sunita Rao (fictional)',age:52,sex:'F',clin:'Dr. A. Sharma'}],
cases:[{id:'C-2001',pid:'P-1001',cr:d(-20),inj:d(-21)+'T18:30',mech:'Hot liquid scald',reg:['Left Hand','Left Arm'],assess:'Entered by clinician: partial area involvement, dressing applied.',clin:'Dr. A. Sharma',fu:d(2),status:'Follow-up Required',notes:[{t:d(-20),by:'Dr. A. Sharma',x:'Initial review. Plan: dressing and review as set by clinician.'}]},
{id:'C-2002',pid:'P-1002',cr:d(-6),inj:d(-6)+'T09:10',mech:'Flame',reg:['Right Thigh'],assess:'',clin:'Dr. K. Iyer',fu:d(-1),status:'Referred',notes:[]},
{id:'C-2003',pid:'P-1003',cr:d(-45),inj:d(-46)+'T20:00',mech:'Chemical',reg:['Chest'],assess:'Entered by clinician: reviewed, healing documented.',clin:'Dr. A. Sharma',fu:'',status:'Closed',notes:[{t:d(-30),by:'Dr. A. Sharma',x:'Healing documented. Discharged from active follow-up.'}]}],
fus:[{id:'F-1',cid:'C-2001',clin:'Dr. A. Sharma',due:d(2),status:'Pending',notes:'Wound review'},{id:'F-2',cid:'C-2002',clin:'Dr. K. Iyer',due:d(-1),status:'Pending',notes:'Post-referral check'},{id:'F-3',cid:'C-2003',clin:'Dr. A. Sharma',due:d(-30),status:'Completed',notes:'Final review'}],
refs:[{id:'R-1',cid:'C-2002',from:'Demo Hospital — Sample Data',to:'Demo Burn Centre (fictional)',reason:'Specialist burn-unit review requested by clinician.',notes:'Fictional demo referral.',date:d(-5),status:'Pending'}],
kb:[{id:'K-1',title:'Immediate first aid (sample)',cat:'First aid',src:'Sample — pending clinician review',rev:d(-10),st:'Under Review'},{id:'K-2',title:'When to seek urgent care (sample)',cat:'Emergency escalation',src:'Sample — pending clinician review',rev:d(-10),st:'Under Review'},{id:'K-3',title:'Follow-up purpose (sample)',cat:'Follow-up education',src:'Demo Hospital (fictional)',rev:d(-3),st:'Draft'}]}}
let D;try{D=JSON.parse(localStorage.getItem(K))||seed()}catch(e){D=seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const nid=(p,a)=>p+((Math.max(0,...a.map(x=>parseInt(x.id.split('-')[1])||0)))+1);
const pn=id=>(D.pts.find(p=>p.id==id)||{}).name||id,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=s=>`<span class="st ${s}">${s}</span>`;
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
/* ===== 5. FORMS & VALIDATION ===== */
function modal(title,fields,vals,cb){vals=vals||{};
$('#mb').innerHTML=`<h3>${title}</h3><form id="f" onsubmit="return false">`+fields.map(f=>{const v=vals[f.k]??f.v??'';let i;
if(f.t=='select')i=`<select name="${f.k}">${f.o.map(o=>{o=[].concat(o);return`<option value="${esc(o[0])}" ${o[0]==v?'selected':''}>${esc(o[1]??o[0])}</option>`}).join('')}</select>`;
else if(f.t=='textarea')i=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
else i=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}">`;
return`<label>${f.l}${f.req?' *':''}</label>${i}`}).join('')+`<p class="err" id="er"></p><div class="row"><button id="sv">Save</button><button class="s" onclick="closeM()">Cancel</button></div></form>`;
$('#mod').style.display='flex';
$('#sv').onclick=()=>{const o={};new FormData($('#f')).forEach((v,k)=>o[k]=v.trim());const m=fields.filter(f=>f.req&&!o[f.k]);if(m.length){$('#er').textContent='Please complete: '+m.map(f=>f.l).join(', ');return}cb(o);closeM()}}
const closeM=()=>$('#mod').style.display='none';
const caseOpts=()=>D.cases.map(c=>[c.id,c.id+' — '+pn(c.pid)]),ptOpts=()=>D.pts.map(p=>[p.id,p.name]);
/* ===== 3. NAVIGATION ===== */
const NAV=[['ov','Overview'],['ai','BurnCare AI'],['pt','Patients'],['cs','Burn Cases'],['bm','Digital Body Map'],['fu','Follow-ups'],['rf','Referrals'],['an','Hospital Analytics'],['kc','Knowledge Centre'],['se','Settings']];
let cur='ov',sel={pid:null,cid:null},flt={q:'',s:''};
function go(v,x){cur=v;tb=null;bmSel=null;if(x)Object.assign(sel,x);flt={q:'',s:''};nav.classList.remove('open');draw()}
function draw(){$('#nav').innerHTML=NAV.map(n=>`<a tabindex="0" class="${n[0]==cur?'on':''}" onclick="go('${n[0]}')" onkeydown="if(event.key=='Enter')go('${n[0]}')">${n[1]}</a>`).join('');
$('#hn').textContent=D.set.hosp;$('#un').textContent=D.set.user;$('#nn').textContent=D.fus.filter(f=>f.status=='Pending'&&f.due<T).length;
$('#v').innerHTML=V[cur]();if(cur=='ai')chatInit();if(cur=='bm'){bmInit();tbInit()}}
const head=(t,s,b)=>`<div class="row"><div><h1>${t}</h1><div class="sub">${s||''}</div></div>${b||''}</div>`;
const bars=o=>{const m=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/m*60}%"></i><b>${v}</b></div>`).join('')};
const cnt=(a,f)=>a.reduce((o,x)=>(o[f(x)]=(o[f(x)]||0)+1,o),{});
const doc=()=>D.cases.length?Math.round(D.cases.filter(c=>c.assess&&c.notes.length).length/D.cases.length*100):0;
/* ===== VIEWS ===== */
const V={
ov(){const due=D.fus.filter(f=>f.status=='Pending'&&f.due<=d(7)).length,rp=D.refs.filter(r=>r.status=='Pending').length,nm=D.cases.filter(c=>c.cr.slice(0,7)==T.slice(0,7)).length;
return head('Overview','Demo Hospital — Sample Data. All figures are sample/demo data.',`<button onclick="caseForm()">New case</button><button class="s" onclick="go('ai')">Open BurnCare AI</button><button class="s" onclick="go('rf')">Generate referral</button>`)+
`<div class="grid g5">${[['Total demo cases',D.cases.length],['New this month',nm],['Follow-ups due (7 days)',due],['Referrals pending',rp],['Documentation complete',doc()+'%']].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div><br>
<div class="grid g2"><div class="card"><h3>Recent case activity</h3>${D.cases.slice(-4).reverse().map(c=>`<p><a href="#" onclick="go('cs',{cid:'${c.id}'});return false">${c.id}</a> ${esc(pn(c.pid))} ${st(c.status)}</p>`).join('')||'No cases yet.'}</div>
<div class="card"><h3>Upcoming follow-ups</h3>${D.fus.filter(f=>f.status=='Pending').sort((a,b)=>a.due>b.due?1:-1).slice(0,4).map(f=>`<p>${f.due} — ${f.cid} ${f.due<T?st('Overdue'):''}</p>`).join('')||'None.'}</div>
<div class="card"><h3>Cases by status (sample)</h3>${bars(cnt(D.cases,c=>c.status))}</div><div class="card"><h3>Referral status (sample)</h3>${bars(cnt(D.refs,r=>r.status))}</div></div>`},
ai(){const L=D.set.lang=='hi';return head('BurnCare AI',(L?'सामान्य जानकारी — केवल डेमो':'General information — demonstration only'),`<button class="s" onclick="D.set.lang=D.set.lang=='hi'?'en':'hi';save();draw()">${L?'English':'हिन्दी'}</button><button class="s" onclick="chat=[];chatInit()">${L?'बातचीत साफ़ करें':'Clear conversation'}</button>`)+
`<p><span class="tag">Prototype Mode — Rule-Based Responses, Not Live AI</span></p><div class="warn"><b>Demo information only. This prototype is not a substitute for professional medical assessment.</b></div><div id="chat"></div><div style="margin:8px 0">${QS.map((q,i)=>`<span class="chip" onclick="ask(QS[${i}][D.set.lang=='hi'?1:0])">${q[D.set.lang=='hi'?1:0]}</span>`).join('')}</div><div class="row"><input id="ci" placeholder="${L?'अपना प्रश्न लिखें':'Type your question'}" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">${L?'भेजें':'Send'}</button></div>`},
pt(){if(sel.pid)return ptDetail();const q=flt.q.toLowerCase(),r=D.pts.filter(p=>(p.name+p.id).toLowerCase().includes(q)&&(!flt.s||D.cases.some(c=>c.pid==p.id&&c.status==flt.s)));
return head('Patients','Fictional records only.',`<button onclick="ptForm()">New patient</button>`)+filt()+`<div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Cases</th><th>Clinician</th><th>Last visit</th><th>Next follow-up</th></tr>${r.map(p=>{const cs=D.cases.filter(c=>c.pid==p.id),nx=D.fus.filter(f=>cs.some(c=>c.id==f.cid)&&f.status=='Pending').map(f=>f.due).sort()[0];return`<tr class="cl" onclick="go('pt',{pid:'${p.id}'})"><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.age}</td><td>${cs.length}</td><td>${esc(p.clin)}</td><td>${cs.map(c=>c.cr).sort().pop()||'—'}</td><td>${nx||'—'}</td></tr>`}).join('')||'<tr><td colspan=7>No matching patients.</td></tr>'}</table></div>`},
cs(){if(sel.cid)return csDetail();const q=flt.q.toLowerCase(),r=D.cases.filter(c=>(c.id+pn(c.pid)+c.mech).toLowerCase().includes(q)&&(!flt.s||c.status==flt.s));
return head('Burn Cases','Clinician-entered fields are marked in case detail.',`<button onclick="caseForm()">New case</button>`)+filt()+`<div class="card tw"><table><tr><th>Case</th><th>Patient</th><th>Injury</th><th>Mechanism</th><th>Status</th><th>Follow-up</th></tr>${r.map(c=>`<tr class="cl" onclick="go('cs',{cid:'${c.id}'})"><td>${c.id}</td><td>${esc(pn(c.pid))}</td><td>${c.inj.replace('T',' ')}</td><td>${esc(c.mech)}</td><td>${st(c.status)}</td><td>${c.fu||'—'}</td></tr>`).join('')||'<tr><td colspan=6>No matching cases.</td></tr>'}</table></div>`},
bm(){return head('Digital Body Map','Mark regions manually, then use the Lund &amp; Browder TBSA calculator. Clinician must verify; no severity or treatment is suggested.')+
`<div class="grid g2"><div class="card"><div class="row"><button class="s" onclick="bmv='front';bmInit(1)">Rotate to front</button><button class="s" onclick="bmv='back';bmInit(1)">Rotate to back</button></div><svg class="bm" id="bms" viewBox="0 0 200 395" style="max-width:250px;width:100%;perspective:600px"></svg></div>
<div class="card"><label>Demo case</label><select id="bmc" onchange="bmSel=null;bmInit();tbInit(1)">${D.cases.map(c=>`<option value="${c.id}">${c.id} — ${esc(pn(c.pid))}</option>`).join('')}</select><label>Patient age (years) for Lund &amp; Browder values</label><input id="bma" type="number" min="0" max="120" oninput="bmCalc()"><h3 style="margin-top:14px">Selected regions &amp; TBSA</h3><div id="bml"></div><div class="row"><button onclick="bmSave()">Save to case</button><button class="s" onclick="bmSel=[];bmCov={};bmInit()">Clear selection</button></div></div></div><br>
<div class="card"><h3>TBSA calculator — Lund &amp; Browder chart</h3><div class="warn">Calculation aid using clinician-entered inputs. Count only areas the treating clinician judges partial-thickness or deeper (not simple redness). Result must be verified by the treating clinician. Not a diagnosis; no treatment decisions are made here.</div><div class="row"><div><label>Age band (sets Lund &amp; Browder values)</label><select id="tba" onchange="tb.age=+this.value;tbDraw()">${TBA.map((a,i)=>`<option value="${i}">${a}</option>`).join('')}</select></div><div style="text-align:center"><span class="kpi"><b id="tbt">0.0%</b></span><span style="color:var(--mut)">Estimated TBSA (demo calculation)</span></div></div><div class="tw"><table><thead><tr><th>Region</th><th>Region = % of body</th><th>% of region burned (0–100)</th><th>Adds</th></tr></thead><tbody id="tbb"></tbody></table></div><div class="row" style="margin-top:10px"><button onclick="tbSave()">Save TBSA to selected case</button><button class="s" onclick="tb.r={};tbDraw()">Reset calculator</button></div></div><br><div class="card"><h3>Wound photograph documentation</h3><div class="warn"><b>Use fictional or appropriately authorized test images only. Do not use real patient photographs in this demo.</b> Images stay in this browser tab only and are lost on refresh.</div><div class="card" style="background:#f4f9ff"><h3>How to capture a wound image</h3><div class="grid g2"><ol style="margin:0;padding-left:18px"><li>Confirm authorization/consent and use a fictional or test subject in this demo.</li><li>Use soft, even light. Avoid flash glare, harsh shadows and coloured light.</li><li>Place a plain, non-reflective background (blue or green drape) behind the area.</li><li>Hold the camera parallel to the wound surface, about 30–50 cm away. The area should fill about two-thirds of the frame.</li><li>Place a ruler or scale and a label (case ID and date, no name) beside the wound in the same plane.</li><li>Take three shots: whole-region overview, mid-range, and close-up. Tap to focus and hold still.</li><li>Repeat from the same angle and distance at each visit so photos can be compared.</li><li>Avoid faces and identifying features unless the clinician requires them and consent is documented.</li></ol><svg viewBox="0 0 220 170" style="width:100%;max-width:260px" aria-label="Capture guide"><rect x="10" y="8" width="200" height="140" rx="6" fill="#fff" stroke="#1769AA" stroke-width="2" stroke-dasharray="6 4"/><path d="M60 50C80 30 130 34 150 56C165 76 140 112 100 112C60 112 40 74 60 50Z" fill="#f4c2c2" stroke="#D9363E"/><rect x="164" y="30" width="10" height="90" fill="#fff" stroke="#12345A"/><path d="M164 40h6M164 50h6M164 60h6M164 70h6M164 80h6M164 90h6M164 100h6M164 110h6" stroke="#12345A"/><rect x="22" y="118" width="62" height="20" fill="#fff" stroke="#12345A"/><text x="27" y="132" font-size="9" fill="#12345A">C-2001 · date</text><text x="110" y="162" font-size="10" fill="#5d6b7c" text-anchor="middle">wound ~2/3 of frame · scale · label</text></svg></div></div><br><div class="grid g2"><div><label>Select image</label><input type="file" accept="image/*" id="pf" onchange="pPrev(this)"><label>Or use phone camera</label><input type="file" accept="image/*" capture="environment" onchange="pPrev(this)"><label>Case</label><select id="pc">${D.cases.map(c=>`<option>${c.id}</option>`).join('')}</select><label>Date and time</label><input id="pd" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"><label>Notes</label><textarea id="pnn" rows="2"></textarea><label><input type="checkbox" id="pk" style="width:auto"> I confirm this is a fictional/authorized demo image</label><br><button onclick="pAdd()">Attach to case (this session)</button></div><div><div id="pv"></div><div id="pq"></div></div></div><div id="pg" class="row" style="margin-top:12px"></div></div>`},

function pPrev(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#pv').innerHTML=`<img src="${r.result}" style="max-width:100%;max-height:220px;border-radius:6px">`;$('#pv').dataset.src=r.result;qc(r.result)};r.readAsDataURL(f)}
function pAdd(){const s=$('#pv').dataset.src;if(!s){toast('Select an image first',1);return}if(!$('#pk').checked){toast('Confirm the demo consent checkbox',1);return}photos.push({s,c:$('#pc').value,d:$('#pd').value,n:$('#pnn').value,q:$('#pq').dataset.v||''});$('#pg').innerHTML=photos.map(p=>`<div class="card" style="flex:0 0 160px"><img src="${p.s}" style="width:100%"><small>${p.c}<br>${p.d.replace('T',' ')}<br>${esc(p.n)}<br><i>${p.q}</i></small></div>`).join('');toast('Photo attached (session only)')}
/* ===== TBSA (Lund & Browder) & IMAGE QUALITY ===== */
const TBA=['0–1 year','1–4 years','5–9 years','10–14 years','15 years','Adult'];
const LBT=[['Head',[19,17,13,11,9,7]],['Neck',2],['Anterior trunk',13],['Posterior trunk',13],['Right buttock',2.5],['Left buttock',2.5],['Genitalia / perineum',1],['Right upper arm',4],['Left upper arm',4],['Right lower arm',3],['Left lower arm',3],['Right hand',2.5],['Left hand',2.5],['Right thigh',[5.5,6.5,8,8.5,9,9.5]],['Left thigh',[5.5,6.5,8,8.5,9,9.5]],['Right leg',[5,5,5.5,6,6.5,7]],['Left leg',[5,5,5.5,6,6.5,7]],['Right foot',3.5],['Left foot',3.5]];
let tb=null;const lbv=(r,a)=>Array.isArray(r[1])?r[1][a]:r[1];
function tbInit(re){if(!$('#tbb'))return;if(!tb||re){const c=D.cases.find(x=>x.id==($('#bmc')||{}).value)||D.cases[0];const p=c&&D.pts.find(x=>x.id==c.pid),ag=p?p.age:30;tb=c&&c.tbd?{age:c.tbd.age,r:{...c.tbd.r}}:{age:ag<1?0:ag<5?1:ag<10?2:ag<15?3:ag<16?4:5,r:{}}}tbDraw()}
function tbDraw(){$('#tba').value=tb.age;$('#tbb').innerHTML=LBT.map((r,i)=>`<tr><td>${r[0]}</td><td>${lbv(r,tb.age)}%</td><td><input type="number" min="0" max="100" step="5" value="${tb.r[i]||0}" oninput="tbSet(${i},this.value)" style="max-width:110px"></td><td id="tc${i}">${((tb.r[i]||0)*lbv(r,tb.age)/100).toFixed(1)}%</td></tr>`).join('');tbTot()}
function tbPct(){return LBT.reduce((s,r,i)=>s+(tb.r[i]||0)*lbv(r,tb.age)/100,0)}
function tbSet(i,v){v=Math.max(0,Math.min(100,+v||0));tb.r[i]=v;$('#tc'+i).textContent=(v*lbv(LBT[i],tb.age)/100).toFixed(1)+'%';tbTot()}
function tbTot(){$('#tbt').textContent=tbPct().toFixed(1)+'%'}
function tbSave(){const c=D.cases.find(x=>x.id==$('#bmc').value);if(!c){toast('Create a case first',1);return}c.tbd={age:tb.age,r:{...tb.r}};c.tbsa=Math.round(tbPct()*10)/10;save();toast('TBSA '+c.tbsa.toFixed(1)+'% saved to '+c.id+' (clinician to verify)')}
/* assisted capture check: local image analysis, NOT a trained AI model */
function qc(src){const im=new Image();im.onload=()=>{const w=Math.min(256,im.width),h=Math.max(3,Math.round(im.height*w/im.width)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const p=x.getImageData(0,0,w,h).data,g=[];let s=0,hi=0,lo=0;for(let i=0;i<p.length;i+=4){const y=.299*p[i]+.587*p[i+1]+.114*p[i+2];g.push(y);s+=y;if(y>245)hi++;if(y<20)lo++}const n=g.length,m=s/n,l=[];for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const k=j*w+i;l.push(4*g[k]-g[k-1]-g[k+1]-g[k-w]-g[k+w])}const mu=l.reduce((a,b)=>a+b,0)/l.length,sh=l.reduce((a,b)=>a+(b-mu)**2,0)/l.length,mn=Math.min(im.width,im.height);
const ck=[[mn>=720,'Resolution '+im.width+'×'+im.height,'Low resolution — move closer or use the main camera.'],[m>=70&&m<=200,'Lighting '+Math.round(m)+'/255','Too dark or too bright — use soft, even light.'],[hi/n<.05,'Glare','Bright glare spots — turn off flash, change angle.'],[lo/n<.25,'Shadows','Large dark areas — reduce shadows, add diffuse light.'],[sh>=40,'Sharpness','Possibly blurred — hold steady, tap to focus, retake.']],bad=ck.filter(k=>!k[0]).length;
const v=bad?bad+' point(s) to review — retake suggested':'Quality checks passed';$('#pq').dataset.v='Capture check: '+v;
$('#pq').innerHTML=`<div class="card" style="margin-top:8px"><h3>Assisted capture check</h3><span class="tag">Local image analysis — not a trained AI model; does not assess the wound</span>${ck.map(k=>`<p style="margin:5px 0">${k[0]?'✅':'⚠️'} <b>${k[1]}</b>${k[0]?'':'<br><small>'+k[2]+'</small>'}</p>`).join('')}<p><b>${v}</b></p><small>Reminder: include a scale and case label beside the wound.</small></div>`};im.src=src}
/* ===== 6. CHATBOT DEMO RULES ===== */
const QS=[['What should someone do immediately after a burn?','जलने के तुरंत बाद क्या करना चाहिए?'],['What should not be applied to a burn?','जले हुए स्थान पर क्या नहीं लगाना चाहिए?'],['When should urgent medical care be sought?','तुरंत चिकित्सा सहायता कब लेनी चाहिए?'],['What information should be shared with a doctor?','डॉक्टर को कौन सी जानकारी देनी चाहिए?'],['How can I contact this demo hospital?','इस डेमो अस्पताल से संपर्क कैसे करें?'],['What is the purpose of a burn-care follow-up?','बर्न-केयर फ़ॉलो-अप का उद्देश्य क्या है?']];
const SRC='Source: Sample content — requires clinician review';
const RULES=[
{k:/immediate|first aid|after a burn|तुरंत|प्राथमिक/i,en:'General first-aid information: move away from the heat source, cool the area with cool (not ice-cold) running water for about 20 minutes, remove rings or loose items near the area unless stuck to skin, and cover loosely with a clean non-fluffy material. Seek professional assessment.',hi:'सामान्य प्राथमिक जानकारी: गर्मी के स्रोत से दूर हों, प्रभावित जगह को लगभग 20 मिनट ठंडे (बर्फ जैसे नहीं) बहते पानी से ठंडा करें, अंगूठी/ढीली चीज़ें हटाएँ (यदि त्वचा से चिपकी न हों), और साफ़ कपड़े से ढीला ढकें। पेशेवर जाँच कराएँ।'},
{k:/not.*appl|ice|butter|toothpaste|ghee|oil|नहीं लगाना|क्या नहीं/i,en:'General information: avoid applying ice, butter, ghee, oil, toothpaste or home remedies, and avoid bursting blisters. Ask a qualified clinician what is suitable.',hi:'सामान्य जानकारी: बर्फ, मक्खन, घी, तेल, टूथपेस्ट या घरेलू नुस्खे न लगाएँ, और फफोले न फोड़ें। उपयुक्त उपचार के लिए योग्य चिकित्सक से पूछें।'},
{k:/urgent|when.*(seek|care|doctor)|कब|तुरंत चिकित्सा/i,en:'General guidance: seek urgent medical care for burns that are large, on the face, hands, feet or genitals, caused by chemicals or electricity, involve breathing difficulty, or affect children or older adults. When in doubt, seek help.',hi:'सामान्य मार्गदर्शन: बड़े जलने, चेहरे/हाथ/पैर/जननांग पर जलने, रसायन या बिजली से जलने, साँस की तकलीफ़, या बच्चों/बुज़ुर्गों में तुरंत चिकित्सा सहायता लें। संदेह हो तो मदद लें।',em:1},
{k:/share|information.*doctor|tell.*doctor|जानकारी/i,en:'Useful to share: when and how the injury happened, the body areas affected, what first aid was done, pain level, allergies, current medicines, tetanus status and any medical conditions.',hi:'साझा करने योग्य: चोट कब और कैसे लगी, कौन से अंग प्रभावित हैं, क्या प्राथमिक उपचार हुआ, दर्द, एलर्जी, चल रही दवाएँ, टिटनेस स्थिति और अन्य बीमारियाँ।'},
{k:/contact|phone|address|hospital|संपर्क|अस्पताल/i,en:'FICTIONAL demo details only: Demo Hospital — Sample Data · Burn OPD (placeholder) · Phone: 000-000-0000 (placeholder) · Email: demo@example.invalid. Replace with approved hospital information before any real use.',hi:'केवल काल्पनिक डेमो विवरण: डेमो हॉस्पिटल · बर्न OPD (प्लेसहोल्डर) · फ़ोन: 000-000-0000 (प्लेसहोल्डर)। वास्तविक उपयोग से पहले अनुमोदित जानकारी डालें।'},
{k:/follow.?up|फ़ॉलो|फॉलो/i,en:'Follow-up lets the treating clinician review wound progress, update the plan, arrange referrals or rehabilitation, and answer questions. The schedule is decided by the clinician.',hi:'फ़ॉलो-अप में उपचार करने वाले चिकित्सक घाव की प्रगति देखते हैं, योजना बदलते हैं, रेफ़रल या पुनर्वास तय करते हैं। समय-सारणी चिकित्सक तय करते हैं।'}];
const EMG=/large|face|chemical|electric|breath|unconscious|infant|baby|severe|inhalation|smoke|बड़ा|चेहरा|रसायन|बिजली|साँस|बेहोश|गंभीर/i;
let chat=[];
function chatInit(){const c=$('#chat');if(!c)return;const L=D.set.lang=='hi';c.innerHTML=chat.length?chat.map(m=>`<div class="msg ${m.c}">${esc(m.x)}${m.s?`<span class="src">${m.s}</span>`:''}</div>`).join(''):`<p style="color:var(--mut);text-align:center;margin-top:120px">${L?'कोई प्रश्न चुनें या लिखें। यह डेमो नियम-आधारित है।':'Choose a suggested question or type your own. Answers come from fixed demo rules.'}</p>`;c.scrollTop=c.scrollHeight}
function ask(q){const i=$('#ci');q=(q||i.value).trim();if(!q)return;i.value='';const L=D.set.lang=='hi';chat.push({c:'u',x:q});
if(EMG.test(q))chat.push({c:'em',x:L?'⚠ यह गंभीर हो सकता है। देरी न करें — तुरंत नज़दीकी आपातकालीन सेवा/योग्य चिकित्सक से संपर्क करें।':'⚠ This may be serious. Do not wait — seek urgent professional medical help or contact local emergency services now.'});
chatInit();const c=$('#chat');c.insertAdjacentHTML('beforeend','<div class="msg b" id="ty">…</div>');c.scrollTop=c.scrollHeight;
setTimeout(()=>{const r=RULES.find(r=>r.k.test(q));chat.push(r?{c:'b',x:L?r.hi:r.en,s:SRC}:{c:'b',x:L?'यह प्रोटोटाइप इस प्रश्न का भरोसेमंद उत्तर नहीं दे सकता। कृपया योग्य चिकित्सक से संपर्क करें।':'This prototype cannot answer that reliably. Please contact a qualified clinician.'});chatInit()},600)}
